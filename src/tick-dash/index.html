<!DOCTYPE html>
<!-- World: clockwork tower - a tin wind-up mouse flips between the brass floor and ceiling beams of a clock tower, past copper gears, pistons and pendulums, on deep teal walls and walnut wood; its spring runs down unless it grabs brass winding keys -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tick Dash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 5H23C27.5 5 30 7.5 31 12L31.5 21C31.8 25 30 27.5 27 27.5C24.5 27.5 23.5 26 22.5 24L21.5 22H10.5L9.5 24C8.5 26 7.5 27.5 5 27.5C2 27.5 0.2 25 0.5 21L1 12C2 7.5 4.5 5 9 5Z' fill='%23ff6b4a'/%3E%3Cpath d='M9 10.5v7M5.5 14h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='15.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='26' cy='12' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --walnut: #241a12; --brass: #e0a93f; --ivory: #f4e8c8; --copper: #c4622d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--walnut); color: var(--ivory);
    font-family: "Iowan Old Style", Palatino, "Hiragino Mincho ProN", "Songti SC", Georgia, serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; z-index: 1; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);
    max-width: 520px; margin: 0 auto; pointer-events: none; /* taps on the empty HUD strip still reach the canvas */
  }
  #hud button { pointer-events: auto; }
  .ctl { display: flex; gap: 8px; justify-self: end; }
  #tally { text-align: center; }
  #tally b { display: block; font-size: 40px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 var(--walnut), 0 0 8px var(--walnut); }
  #tally small { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; letter-spacing: .22em; color: var(--brass); }
  #wind { width: 124px; height: 12px; margin: 7px auto 0; border: 2px solid var(--brass); border-radius: 7px; background: rgba(36, 26, 18, .8); overflow: hidden; }
  #wind i { display: block; width: 100%; height: 100%; background: linear-gradient(var(--brass), #b98524); transform-origin: left; transform: scaleX(1); }
  #wind.low i { background: var(--copper); animation: tick .5s steps(2) infinite; }
  @keyframes tick { 50% { opacity: .35; } }
  #pips { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  #pips i { width: 10px; height: 10px; border: 2px solid var(--brass); border-radius: 50%; background: rgba(36, 26, 18, .8); }
  #pips i.on { background: var(--brass); }
  #pips.fade i.on { animation: tick .5s steps(2) infinite; }
  #pips.hot i.on { background: var(--ivory); border-color: var(--ivory); box-shadow: 0 0 8px var(--brass); }
  button {
    width: 42px; height: 42px; border: 2px solid var(--brass); border-radius: 8px; padding: 0; box-shadow: inset 0 0 0 2px var(--walnut), inset 0 0 0 3.5px rgba(224, 169, 63, .45); color: var(--brass); cursor: pointer;
    display: grid; place-items: center; background: rgba(36, 26, 18, .78);
  }
  button:active { background: var(--brass); color: var(--walnut); }
  button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  button svg .solid { fill: currentColor; stroke-width: 1.2; }
  .x { display: none; }
  #snd.off .x { display: inline; }
  #snd.off .wave { display: none; }
  #snd.off { opacity: .5; }
  #hint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: max-content; max-width: 88vw;
    padding: 9px 18px; border: 2px solid var(--brass); border-radius: 4px; background: rgba(36, 26, 18, .82);
    text-align: center; font-size: 16px; font-weight: 700; line-height: 1.4; letter-spacing: .05em; pointer-events: none;
  }
  #over {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(20, 14, 9, .86); cursor: pointer;
  }
  #over.show { display: flex; }
  #over h1 { margin: 0; padding-bottom: 8px; font-size: 44px; font-weight: 700; letter-spacing: .04em; color: var(--brass); border-bottom: 4px double var(--brass); }
  #over p { margin: 0; font-size: 26px; font-weight: 700; }
  #over .tap { padding: 8px 20px; border-radius: 4px; background: var(--brass); color: var(--walnut); font-size: 16px; }
  #help {
    position: fixed; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; background: #1a130d;
    padding-bottom: calc(env(safe-area-inset-bottom) + 28px); /* the top and sides are set by placeHelp() */
  }
  #help.show { display: flex; }
  #hclose { position: fixed; }
  #help .langs { display: grid; flex: none; grid-template-columns: 1fr 1fr; width: 160px; height: 36px; gap: 8px; align-self: flex-start; }
  #help .langs button { width: auto; height: 100%; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 700; background: transparent; color: var(--brass); }
  #help .langs button.on { background: var(--brass); color: var(--walnut); }
  /* the body sits in a fixed-height box centred vertically, text top-aligned inside, so switching language moves nothing */
  #help .main { width: min(100%, 340px); flex: 1; min-height: 0; display: flex; align-items: center; padding-bottom: 40px; }
  #help .body { width: 100%; height: 430px; max-height: 100%; }
  #help h2 { margin: 0 0 22px; font-size: 26px; line-height: 44px; font-weight: 700; color: var(--brass); border-bottom: 2px solid rgba(224, 169, 63, .4); }
  #help ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; counter-reset: n; }
  #help li {
    position: relative; padding-left: 40px; font-size: 15px; line-height: 1.7; counter-increment: n;
    text-wrap: pretty; word-break: auto-phrase; line-break: strict;
  }
  #help li::before {
    content: counter(n); position: absolute; left: 0; top: 2px; width: 26px; height: 26px; border: 2px solid var(--brass); border-radius: 50%;
    color: var(--brass); font-size: 13px; font-weight: 700; line-height: 22px; text-align: center;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <button id="rst" data-aria="restart"><svg viewBox="0 0 24 24"><path d="M19.05 14.57A7.5 7.5 0 1 1 15.75 5.5"/><path class="solid" d="M17.35 2.73L18.69 7.2L14.15 8.27Z"/></svg></button>
  <div id="tally"><b id="score">0</b><small><span data-t="best"></span> <span id="best">0</span></small><div id="wind"><i id="windfill"></i></div><div id="pips"></div></div>
  <div class="ctl">
  <button id="snd" data-aria="sound"><svg viewBox="0 0 24 24"><path class="solid" d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.3a8 8 0 0 1 0 11.4"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <button id="qbtn" data-aria="help"><svg viewBox="0 0 24 24"><path d="M8.8 9.2a3.3 3.3 0 1 1 4.6 3c-.9.5-1.4 1-1.4 2"/><path d="M12 17.8v.1"/></svg></button>
  </div>
</div>
<div id="hint" data-t="hint"></div>
<div id="over"><h1 id="cause"></h1><p id="final"></p><p class="tap" data-t="retry"></p></div>
<div id="help">
  <div class="langs"><button data-l="en" lang="en">English</button><button data-l="ja" lang="ja">日本語</button></div>
  <div class="main"><div class="body"><h2 data-t="title"></h2><ul id="hlist"></ul></div></div>
  <button id="hclose" data-aria="close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
</div>

<script>
(() => {
  const KEY = 'ofwg:tick-dash';
  // The world is WH units tall and scaled to the viewport height; its width follows the (capped) column width.
  // The corridor runs between a ceiling line and a floor line; the mouse stands on one of them and only ever flips between them.
  const WH = 640, COL_MAX = 520, CEIL = 170, FLOOR = 500, R = 12, BX = 64, HIT = 0.8; // BX is low so a phone still shows about a second ahead
  const TRANSIT = 0.24; // a full flip always takes this long; gravity is derived from it so spacing can be set in seconds
  const LANE_TOP = CEIL + R, LANE_BOT = FLOOR - R, ACC = 2 * (LANE_BOT - LANE_TOP) / (TRANSIT * TRANSIT);
  const SPEED_START = 270, SPEED_MAX = 340, SPEED_RAMP = 0.03;
  const REACT_START = 0.28, REACT_MIN = 0.15, REACT_RAMP = 0.000037, SAME_GAP = 50; // reaction time left between hazards on opposite sides
  const DRAIN_START = 0.07, DRAIN_END = 0.085, DRAIN_LEN = 6000, STAGE_WIND = 0.1, SAFE_WIND = 0.08, RISK_WIND = 0.2, WARN_WIND = 0.3, RESCUE_WIND = 0.3;
  const FIRST_X = 300, STAGE_LEN = 1400, STAGE_BONUS = 10, SCORE_PER = 40, KEY_R = 9;
  const CHAIN_S = 4, CHAIN_NEED = 5, BURST_S = 4, BURST_BOOST = 1.5, GRACE_S = 0.7, GRACE_HOLD = 0.8, BURST_WIND = 0.4, BEAT_S = 3, POP_MS = 700, BANNER_MS = 1400, SPARK_MS = 520, SUB = 1 / 120;
  const GEAR_PAD = 3, BOB_R = 13, ROD_W = 3, SWING = 0.5, SWING_PER = 2.3, BRACKET_W = 44;
  const SCALE = [0, 2, 4, 7, 9], TAU = Math.PI * 2;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $hud = document.getElementById('hud');
  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $wind = document.getElementById('wind');
  const $windFill = document.getElementById('windfill');
  const $hint = document.getElementById('hint');
  const $over = document.getElementById('over');
  const $cause = document.getElementById('cause');
  const $final = document.getElementById('final');
  const $snd = document.getElementById('snd');
  const $pips = document.getElementById('pips');
  const pips = Array.from({ length: CHAIN_NEED }, () => $pips.appendChild(document.createElement('i')));

  const TEXT = {
    en: {
      title: 'How to play',
      hint: 'Tap to start · flip gravity',
      items: [
        'You are a wind-up mouse racing through a clock tower for as long as your spring lasts.',
        'Tap anywhere, or press Space, and gravity flips, dropping the mouse to the other side, floor or ceiling.',
        'Brass winding keys rewind your spring, and five grabbed in quick succession set off a dash that smashes everything.',
        'The game is over when the spring runs out or you touch a gear, piston or pendulum.'
      ],
      help: 'Help',
      close: 'Close',
      restart: 'Restart',
      sound: 'Sound',
      best: 'BEST',
      stage: 'STAGE',
      burst: 'Wound up!',
      crash: 'Clang!',
      unwound: 'Unwound',
      retry: 'Tap to retry',
      final: n => (n === 1 ? '1 pt' : `${n} pts`),
    },
    ja: {
      title: '遊び方',
      hint: 'タップでスタート・重力反転',
      items: [
        'ゼンマイじかけのネズミになって、時計塔の中をゼンマイが続くかぎり走るゲームです。',
        '画面のどこかをタップ（またはスペースキー）すると重力が反転し、床と天井を行き来します。',
        '真鍮の巻き鍵でゼンマイが巻き戻り、素早く5つ続けて取ると何でも壊す巻きダッシュが発動します。',
        'ゼンマイが切れるか、歯車・ピストン・振り子に触れるとゲームオーバーです。'
      ],
      help: 'ヘルプ',
      close: '閉じる',
      restart: 'リスタート',
      sound: 'サウンド',
      best: 'ベスト',
      stage: 'ステージ',
      burst: 'フルゼンマイ！',
      crash: 'ガシャン！',
      unwound: 'ゼンマイ切れ',
      retry: 'タップでリトライ',
      final: n => `${n}点`,
    },
  };
  const $help = document.getElementById('help');
  const $qbtn = document.getElementById('qbtn');
  const $hclose = document.getElementById('hclose');
  const $hlist = document.getElementById('hlist');
  const $langBar = document.querySelector('.langs');
  const $langs = $langBar.querySelectorAll('button');

  let tx;
  const setLang = l => {
    tx = TEXT[l];
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = tx[e.dataset.t]; });
    document.querySelectorAll('[data-aria]').forEach(e => e.setAttribute('aria-label', tx[e.dataset.aria]));
    $hlist.replaceChildren(...tx.items.map(t => Object.assign(document.createElement('li'), { textContent: t })));
    $langs.forEach(b => b.classList.toggle('on', b.dataset.l === l));
    if (over) renderOver();
    if (helpOpen) placeHelp(); // the HUD labels changed, so the ? may have moved
  };
  // the ? sits in the HUD row, whose position is only known at runtime: the close button copies its box,
  // the language switch is level with it, and the centred column's left edge mirrors its right edge
  const placeHelp = () => {
    const r = $qbtn.getBoundingClientRect(), barH = $langBar.offsetHeight, w = document.documentElement.clientWidth;
    Object.assign($hclose.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    $help.style.paddingTop = r.top + (r.height - barH) / 2 + 'px';
    $help.style.paddingInline = w - r.right + 'px';
  };
  let helpOpen = false;
  // inert keeps Tab and Enter from reaching the controls behind the panel
  const showHelp = open => {
    helpOpen = open;
    $help.classList.toggle('show', open);
    for (const el of [$hud, $over]) el.inert = open;
    if (open) { placeHelp(); $hclose.focus(); }
  };

  let m, hz, keys, sparks, pops, banner, stage, clock, started, over, cause, overTimer, bonus, shown, dist, wind, windShown, chain, lastKey, shake, slow, queued, flips, crashAt, crashX, crashTx, spin, landed;
  let genX, prevEnd, prevSide, spawned, warned, burst, grace, held, boost, pipsShown;
  let W = 0, H = 0, dpr = 1, s = 1, colX = 0, colW = 0, LW = 0, best = 0;

  try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) { /* storage unavailable */ }

  // muting silences a master gain, so tones already scheduled go quiet too
  let ac = null, master = null, muted = false;
  const audio = () => {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      master = ac.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  // a touch pointerdown is no user activation, so a tone only plays once the context already runs
  const tone = (freq, delay, dur, type, vol) => {
    if (!ac || ac.state !== 'running') return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  };
  // flips alternate a high tick and a low tock, like a clock
  const playFlip = n => tone(n % 2 ? 620 : 880, 0, 0.05, 'square', 0.05);
  const playKey = n => tone(988 * 2 ** (SCALE[Math.min(n, SCALE.length) - 1] / 12), 0, 0.12, 'triangle', 0.09);
  const playStage = () => [0, 4, 7, 12].forEach((st, i) => tone(523 * 2 ** (st / 12), i * 0.06, 0.18, 'triangle', 0.1));
  const playStart = () => [0, 7, 12].forEach((st, i) => tone(330 * 2 ** (st / 12), i * 0.07, 0.16, 'triangle', 0.1));
  const playWarn = () => [0, 1].forEach(i => tone(247, i * 0.14, 0.1, 'square', 0.05));
  const playBurst = () => [0, 4, 7, 12, 16].forEach((st, i) => tone(392 * 2 ** (st / 12), i * 0.05, 0.22, 'triangle', 0.1));
  const playSmash = () => { tone(1400, 0, 0.04, 'square', 0.04); tone(180, 0, 0.12, 'sawtooth', 0.06); };
  const playCrash = () => [5, 1, -4].forEach((st, i) => tone(300 * 2 ** (st / 12), i * 0.08, 0.28, 'sawtooth', 0.08));
  const playUnwound = () => [0, -2, -5, -9].forEach((st, i) => tone(392 * 2 ** (st / 12), i * (0.12 + i * 0.05), 0.3, 'triangle', 0.09));

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  const surf = side => (side ? FLOOR : CEIL); // side 1 is the floor
  const dirOf = side => (side ? -1 : 1); // from a surface into the corridor
  const lane = side => surf(side) + dirOf(side) * R; // the mouse's centre while it stands on that surface

  const speedAt = w => Math.min(SPEED_MAX, SPEED_START + w * SPEED_RAMP);
  const drainAt = d => DRAIN_START + (DRAIN_END - DRAIN_START) * Math.min(1, d / DRAIN_LEN);
  // a brass piston is out for the first 45% of its cycle, pulls back, and thrusts out again after a flashing warning;
  // it only ever opens a gap, so the pattern stays clearable by flipping like any other piston
  const beatU = h => (clock / BEAT_S + h.bp) % 1;
  const beatF = u => (u < 0.45 ? 1 : u < 0.52 ? 1 - (u - 0.45) / 0.07 : u < 0.86 ? 0 : (u - 0.86) / 0.14);
  const lenOf = h => (h.beat ? h.h * beatF(beatU(h)) : h.h);
  const swingAt = (h, c) => h.amp * Math.sin(TAU * c / SWING_PER + h.ph);
  const bobAt = h => { const a = swingAt(h, clock); return [h.x + h.len * Math.sin(a), h.py + dirOf(h.side) * h.len * Math.cos(a)]; };

  // Hazards are placed by edge-to-edge gaps derived from the speed at that spot: opposite sides leave transit plus reaction time,
  // so the speed ramp can never produce a pattern that a flip cannot clear. A hazard on side s is passed on the other side's lane.
  const place = (spec, ext) => {
    const sp = speedAt(genX), react = Math.max(REACT_MIN, REACT_START - genX * REACT_RAMP);
    let gap = prevSide >= 0 && spec.side !== prevSide ? sp * (TRANSIT + react) + 2 * R * HIT + 16 : SAME_GAP;
    gap += spec.extra * sp * (1 - 0.7 * Math.min(1, genX / 5000));
    spec.x = prevEnd + gap + ext; spec.ext = ext;
    // a risk key on that hazard's own lane is dropped unless there is room to grab it and flip clear in time
    const clear = sp * (TRANSIT + react) + 24;
    keys = keys.filter(k => !(k.risk && k.y === lane(spec.side) && k.x > spec.x - ext - clear && k.x < spec.x + ext + 24));
    prevEnd = spec.x + ext; prevSide = spec.side; genX = prevEnd;
    hz.push(spec);
    return spec;
  };
  const gear = (side, extra) => { const r = Math.round(rnd(26, 34)); return place({ type: 'gear', side, r, ph: rnd(0, TAU), extra }, r + GEAR_PAD); };
  const piston = (side, w, extra, beat) => place({ type: 'piston', side, w, h: rnd(100, 170), extra, beat, bp: rnd(0, 1) }, w / 2);
  const pendulum = (side, extra) => {
    const h = rnd(40, 70), py = surf(side) + dirOf(side) * h;
    // the weight stays clear of the opposite lane at the bottom of its swing, so it only threatens a flip in mid-air
    const len = Math.abs(lane(1 - side) - dirOf(side) * 45 - py);
    return place({ type: 'pend', side, w: BRACKET_W, h, py, len, amp: SWING, ph: rnd(0, TAU), extra }, BRACKET_W / 2 + len * Math.sin(SWING) + BOB_R);
  };
  // The only reliable income is the risk key: it sits on the hazard's own side just beyond it, so grabbing it means flipping back early,
  // and it can still be on the wrong lane when the next hazard arrives. A safe key (on the lane that passes the hazard) is a rescue:
  // it is rare while the spring is healthy and common once it runs low, and the very first hazard always carries one to show what keys are.
  const addKey = (x, y, risk) => keys.push({ x, y, risk, ph: rnd(0, TAU), got: false });
  const safeKey = (h, p) => { if (Math.random() < p) addKey(h.x, lane(1 - h.side), false); };
  const riskKey = (h, p) => { if (Math.random() < p) addKey(h.x + h.ext + speedAt(h.x) * TRANSIT + 30, lane(h.side), true); };

  // Patterns arrive in waves of four: three close together, then a breather. Gears and pistons come first, the zigzag and the brass beat pistons at stage 1,
  // and the pendulum and gear-after-piston at stage 2; later stages only reweight the pool and lengthen the zigzag.
  const fillWorld = () => {
    while (genX < dist + LW + 300) {
      const st = Math.floor(genX / STAGE_LEN), side = Math.random() < 0.5 ? 0 : 1, pool = [0];
      if (spawned >= 3) pool.push(1);
      if (st >= 1) pool.push(2, 2);
      if (st >= 2) pool.push(3, 4, 4);
      if (st >= 3) pool.push(3, 4);
      const kind = pool[Math.floor(Math.random() * pool.length)];
      const ex = spawned === 0 ? 0.1 : spawned % 4 === 3 ? rnd(0.8, 1.1) : rnd(0.05, 0.3);
      const due = wind - drainAt(dist) * (genX - dist - BX) / speedAt(genX); // the spring level when this hazard reaches the mouse, whatever the screen size
      const ps = spawned === 0 ? 1 : due < RESCUE_WIND ? 0.6 : 0.06, pr = Math.min(0.45, 0.18 + 0.04 * st);
      spawned++;
      if (kind <= 1) {
        const beat = kind === 1 && st >= 1 && Math.random() < 0.5; // narrow, so the mouse can cross it while it is pulled back
        const h = kind ? piston(side, beat ? rnd(70, 100) : rnd(110, 190), ex, beat) : gear(side, ex);
        safeKey(h, ps); riskKey(h, pr);
        if (beat && Math.random() < 0.8) addKey(h.x, lane(h.side), true); // inside the channel: only reachable while it is pulled back
      }
      else if (kind === 2) { // zigzag: the mouse has to flip between every gear; a key may hang mid-air in a flip
        let sd = side, prev = null;

  const newGame = () => {
    hz = []; keys = []; sparks = []; pops = []; banner = null; stage = 0; clock = 0; chain = 0; lastKey = -1e9; flips = 0;
    started = false; over = false; cause = ''; bonus = 0; dist = 0; wind = 1; shake = 0; slow = 1; queued = false; crashX = BX;
    genX = FIRST_X; prevEnd = FIRST_X; prevSide = -1; spawned = 0; warned = false; burst = 0; grace = 0; held = 0; boost = 1;
    m = { side: 1, y: lane(1), vy: 0, fly: false };

    $over.classList.remove('show');
    $hint.hidden = false;

      $score.textContent = n; $best.textContent = best;
    }
    const lit = burst > 0 ? Math.ceil(burst / BURST_S * CHAIN_NEED) : chain; // during a dash the pips drain with the time left

  const renderOver = () => { $cause.textContent = tx[cause]; $final.textContent = tx.final(shown); };

  const finish = (why, t, hit) => {

    renderOver();

  const touching = (mx, my) => {
    const hr = R * HIT;

  // only a hazard on the side the mouse is on (either side, mid-flip) can still catch it when the dash ends
  const threatened = speed => { const mx = dist + BX; return hz.some(h => !h.dead && (m.fly || h.side === m.side) && h.x - h.ext < mx + speed * 0.7 && h.x + h.ext > mx - 20); };

  const launch = () => { m.fly = true; m.vy = 0; playFlip(flips++); };

  const step = (dt, t) => {
    const speed = speedAt(dist) * boost, n = Math.ceil(dt / SUB), h = dt / n;
    for (let i = 0; i < n; i++) {
      clock += h; dist += speed * h;
      if (burst > 0) bonus += speed * h / SCORE_PER; // a dash doubles the distance score
      if (m.fly) {
        const tgt = 1 - m.side;

      const hit = touching(mx, m.y);

          for (let j = 0; j < 5; j++) sparks.push({ x: BX + rnd(-6, 6), y: m.y + rnd(-6, 6), vx: rnd(-90, 60), vy: rnd(-90, 90), r: rnd(1.2, 2.6), t, c: '#f2c260' });

    if (burst > 0 && Math.random() < 0.7) sparks.push({ x: BX + rnd(-12, 0), y: m.y + rnd(-10, 10), vx: rnd(-240, -90), vy: rnd(-50, 50), r: rnd(1.5, 3.2), t, c: `hsl(${Math.floor(clock * 700) % 360} 100% 65%)` });
    wind -= drainAt(dist) * dt;
    if (wind < WARN_WIND && !warned) { warned = true; playWarn(); } else if (wind > WARN_WIND + 0.15) warned = false;
    fillWorld();

  };

  const flip = () => {
    if (helpOpen || over) return;
    if (!started) { started = true; $hint.hidden = true; playStart(); return; }
    if (m.fly) queued = true; // a tap in mid-air waits for the landing instead of reversing, so the mouse can never hover
    else launch();
  };

  cv.addEventListener('pointerdown', e => { e.preventDefault(); flip(); });
  cv.addEventListener('pointerup', () => audio()); // touch pointerup counts as a user activation, unlike pointerdown
  ['gesturestart', 'contextmenu', 'dblclick'].forEach(n => window.addEventListener(n, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveBest(); });
  window.addEventListener('pagehide', saveBest);
  window.addEventListener('keydown', e => {
    if (helpOpen) { if (e.key === 'Escape') showHelp(false); return; }
    if (e.key !== ' ' && e.key !== 'ArrowUp' && e.key !== 'ArrowDown' && e.key !== 'w' && e.key !== 's') return;
    e.preventDefault();

  });

  // a button that keeps focus would also react to Space, the flip key
  document.querySelectorAll('#hud button').forEach(b => b.addEventListener('click', () => b.blur()));
  $qbtn.addEventListener('click', () => showHelp(true));
  $hclose.addEventListener('click', () => showHelp(false));
  $langs.forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));
  setLang(navigator.language.startsWith('ja') ? 'ja' : 'en');

  $over.addEventListener('click', newGame);
  document.getElementById('rst').addEventListener('click', newGame);
  $snd.addEventListener('click', () => {
    muted = !muted;
    $snd.classList.toggle('off', muted);
    if (master) master.gain.value = muted ? 0 : 1;
    audio();
  });

  const layout = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    s = H / WH;
    colW = Math.min(W, COL_MAX);
    colX = (W - colW) / 2;
    LW = colW / s;
    if (hz) fillWorld();
  };
  window.addEventListener('resize', () => { layout(); if (helpOpen) placeHelp(); });

  const disc = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };
  const FONT = '"Iowan Old Style", Palatino, "Hiragino Mincho ProN", "Songti SC", Georgia, serif';

  // gear outlines, built once per size; sharp teeth for hazards, blunt ones for the scenery
  const gearCache = new Map();

    const id = r + (sharp ? 's' : 'b');

    if (p) return p;

    const n = Math.max(8, Math.round(r / (sharp ? 4.5 : 6))), ri = r - (sharp ? 8 : 10), st = TAU / n;
    for (let i = 0; i < n; i++) {
      const a = i * st, pts = sharp ? [[ri, 0], [r, 0.35], [ri, 0.7]] : [[ri, 0], [r, 0.18], [r, 0.45], [ri, 0.63]];
      for (const [rr, f] of pts) p.lineTo(Math.cos(a + st * f) * rr, Math.sin(a + st * f) * rr);

  };

  // static scenery, built once: the world is WH tall at any viewport, so the gradient never changes
  const wall = ctx.createLinearGradient(0, 0, 0, WH);
  wall.addColorStop(0, '#16292d');
  wall.addColorStop(0.55, '#1d3a3c');
  wall.addColorStop(1, '#2a2016');
  const cogs = Array.from({ length: 7 }, (_, i) => ({ x: i / 7 + rnd(0, 0.08), y: rnd(150, 520), r: rnd(50, 105), k: rnd(0.08, 0.28), dir: i % 2 ? 1 : -1, brass: i % 3 === 0 }));
  const dials = Array.from({ length: 4 }, (_, i) => ({ x: i / 4 + rnd(0, 0.1), y: rnd(210, 450), r: rnd(24, 38) }));

  // chibi wind-up mouse: oversized head, round ears, big shiny eye and pink cheek; after a crash it is dizzy and sees stars
  const drawMouse = (x, y, sy, t) => {
    const dead = over && cause === 'crash', asleep = over && cause === 'unwound', age = over ? (t - crashAt) / 1000 : 0;
    const ph = dist * 0.09, a = asleep ? 8 * (1 - Math.exp(-age * 3)) : m.fly ? clock * 22 : dist * 0.05; // the spring winds down to a stop
    ctx.save();

    ctx.scale(1, sy);
    if (!m.fly) {
      ctx.fillStyle = '#e58f9a';
      ctx.beginPath(); ctx.ellipse(-4 + Math.sin(ph) * 4, 9.5, 3.4, 2.4, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(4 - Math.sin(ph) * 4, 9.5, 3.4, 2.4, 0, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = '#f0a0aa'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, 3); ctx.quadraticCurveTo(-20, 5 + Math.sin(ph) * 3, -21, -4); ctx.stroke();
    ctx.fillStyle = '#d6dcde'; ctx.beginPath(); ctx.ellipse(0, 0.5, 12.5, 9.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f7ecd2'; ctx.beginPath(); ctx.ellipse(1, 4.5, 8, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d6dcde'; disc(3, -9, 5); disc(12, -8.5, 4.6);
    ctx.fillStyle = '#f2a3b0'; disc(3, -9, 2.6); disc(12, -8.5, 2.3);
    ctx.fillStyle = '#d6dcde'; ctx.beginPath(); ctx.ellipse(9, -0.5, 9, 8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f07c92'; disc(17, 0.5, 2);
    if (dead) {
      ctx.strokeStyle = '#2a1c18'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(10.4, -5.6); ctx.lineTo(14, -3.4); ctx.lineTo(10.4, -1.2); ctx.stroke();
      ctx.fillStyle = '#f2c260';
      for (let i = 0; i < 3; i++) {
        const o = age * 5 + i * TAU / 3, sx = 8 + Math.cos(o) * 10, st = -17 + Math.sin(o) * 3;
        ctx.beginPath();
        for (let k = 0; k < 10; k++) { const r = k % 2 ? 1.3 : 3.2, ang = k * Math.PI / 5 - Math.PI / 2; ctx.lineTo(sx + Math.cos(ang) * r, st + Math.sin(ang) * r); }
        ctx.fill();

      ctx.fillStyle = '#f4e8c8'; ctx.font = `700 9px ${FONT}`; ctx.textAlign = 'center';

  const drawKey = (x, y, ph, risk, star) => {

    ctx.restore();
  };

  // pointed teeth along the free end of a column, so nobody mistakes its tip for something to land on
  const drawPiston = (h, x) => {
    const L = lenOf(h), y0 = surf(h.side), d = dirOf(h.side), y1 = y0 + d * L, x0 = x - h.w / 2;
    if (h.beat) {
      const u = beatU(h);
      ctx.fillStyle = u > 0.74 && u < 0.86 && Math.floor(clock * 14) % 2 ? '#ff6b4a' : '#5a3320';
      ctx.fillRect(x0 - 4, d > 0 ? y0 : y0 - 8, h.w + 8, 8);
      if (L < 4) return;
    }
    ctx.fillStyle = h.beat ? '#8a6a24' : '#8c4a2b'; ctx.fillRect(x0, Math.min(y0, y1), h.w, L);
    ctx.fillStyle = 'rgba(255, 190, 120, .16)'; ctx.fillRect(x0 + 5, Math.min(y0, y1), 6, L);
    ctx.strokeStyle = 'rgba(40, 14, 8, .45)'; ctx.lineWidth = 2;
    ctx.beginPath(); for (let k = 1; k * 26 < L; k++) { ctx.moveTo(x0, y0 + d * k * 26); ctx.lineTo(x0 + h.w, y0 + d * k * 26); } ctx.stroke();

    const n = Math.max(3, Math.round(h.w / 14)), tw = h.w / n;
    ctx.beginPath();
    for (let i = 0; i < n; i++) { ctx.moveTo(x0 + i * tw, y1); ctx.lineTo(x0 + (i + 0.5) * tw, y1 + d * 12); ctx.lineTo(x0 + (i + 1) * tw, y1); }
    ctx.fill();
  };

  const drawPend = (h, x) => {
    drawPiston(h, x);
    const [bx, by] = bobAt(h), bwx = bx - dist;
    ctx.strokeStyle = '#e0a93f'; ctx.lineWidth = ROD_W * 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, h.py); ctx.lineTo(bwx, by); ctx.stroke();
    ctx.fillStyle = '#e0a93f'; disc(x, h.py, 5);
    ctx.save(); ctx.translate(bwx, by); ctx.rotate(clock * 2);
    ctx.fillStyle = '#c4622d'; ctx.fill(gearPath(BOB_R + 5, true));
    ctx.fillStyle = '#e0a93f'; disc(0, 0, 4.5);
    ctx.restore();
  };

  const render = t => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#1a130d';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(colX + (shake && (Math.random() - 0.5) * 8 * shake), shake && (Math.random() - 0.5) * 8 * shake);
    ctx.scale(s, s);
    ctx.beginPath(); ctx.rect(0, 0, LW, WH); ctx.clip();
    ctx.fillStyle = wall; ctx.fillRect(0, 0, LW, WH);

    ctx.fillStyle = 'rgba(120, 200, 190, .10)';
    dials.forEach(d => {
      const span = LW + d.r * 4, x = (((d.x * span - dist * 0.18) % span) + span) % span - d.r * 2;
      disc(x, d.y, d.r);
    });
    cogs.forEach(c => {
      const span = LW + c.r * 3, x = (((c.x * span - dist * c.k) % span) + span) % span - c.r * 1.5;
      ctx.save(); ctx.translate(x, c.y); ctx.rotate(dist * c.k / c.r * c.dir);
      ctx.fillStyle = c.brass ? 'rgba(224, 169, 63, .12)' : 'rgba(80, 150, 150, .16)';
      ctx.fill(gearPath(c.r, false), 'evenodd');
      ctx.restore();
    });

    hz.forEach(h => {
      const x = h.x - dist;
      if (h.dead || x < -330 || x > LW + 330) return;
      if (h.type === 'gear') {
        ctx.save(); ctx.translate(x, surf(h.side)); ctx.rotate((h.ph + clock * 1.6) * (h.side ? 1 : -1));
        const gp = gearPath(h.r + GEAR_PAD, true);
        ctx.fillStyle = '#b5542c'; ctx.fill(gp, 'evenodd');
        ctx.strokeStyle = '#4a1f12'; ctx.lineWidth = 2; ctx.stroke(gp);
        ctx.fillStyle = '#e0a93f'; disc(0, 0, h.r * 0.16);
        ctx.restore();
      } else if (h.type === 'piston') drawPiston(h, x);
      else drawPend(h, x);
    });

    ctx.fillStyle = '#2a1d13'; ctx.fillRect(0, -20, LW, CEIL + 20); ctx.fillRect(0, FLOOR, LW, WH - FLOOR + 20);
    ctx.fillStyle = '#e0a93f'; ctx.fillRect(0, CEIL - 5, LW, 5); ctx.fillRect(0, FLOOR, LW, 5);
    ctx.fillStyle = '#9a6a1f';
    ctx.beginPath();
    for (let x = -(dist % 46); x < LW + 46; x += 46) { ctx.moveTo(x + 3, CEIL - 20); ctx.arc(x, CEIL - 20, 3, 0, TAU); ctx.moveTo(x + 3, FLOOR + 20); ctx.arc(x, FLOOR + 20, 3, 0, TAU); }
    ctx.fill();
    ctx.fillStyle = 'rgba(224, 169, 63, .14)';
    for (let x = -(dist % 92); x < LW + 92; x += 92) { ctx.fillRect(x, CEIL - 80, 3, 60); ctx.fillRect(x + 46, FLOOR + 30, 3, 60); }

    keys.forEach(k => { if (!k.got) { const x = k.x - dist; if (x > -20 && x < LW + 20) drawKey(x, k.y, k.ph, k.risk, chain === CHAIN_NEED - 1 && burst <= 0); } });

    if (burst > 0) {
      ctx.fillStyle = 'rgba(244, 232, 200, .22)';
      for (let i = 0; i < 12; i++) ctx.fillRect(LW - ((dist * 1.6 + i * 97) % (LW + 120)), CEIL + 12 + (i * 53) % (FLOOR - CEIL - 24), 60 + (i % 3) * 25, 2);
    }
    const prog = (m.y - LANE_TOP) / (LANE_BOT - LANE_TOP), sy = over ? 1 : 1 - 2 * (1 - prog);
    if (burst > 0) { // star power: a cycling rainbow aura, glowing corridor edges and a flaring mouse
      const hue = Math.floor(clock * 360) % 360;
      ctx.fillStyle = `hsl(${hue} 100% 60% / .22)`; disc(BX, m.y, 36);
      ctx.fillStyle = `hsl(${(hue + 120) % 360} 100% 65% / .28)`; disc(BX, m.y, 26);
      ctx.fillStyle = `hsl(${hue} 100% 60% / ${burst < 1 && Math.floor(clock * 10) % 2 ? 0.08 : 0.3})`;
      ctx.fillRect(0, CEIL, LW, 8); ctx.fillRect(0, FLOOR - 8, LW, 8);
    }
    if (m.fly || burst > 0) {
      const gap = burst > 0 ? 9 : 3;
      for (let i = 3; i >= 1; i--) { ctx.globalAlpha = 0.16 * (4 - i); drawMouse(BX - i * gap, m.y - m.vy * 0.012 * i, sy); }
      ctx.globalAlpha = 1;
    }
    if (grace > 0 && Math.floor(clock * 12) % 2) ctx.globalAlpha = 0.35;
    drawMouse(crashX, m.y, sy, t);
    if (burst > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.3 + 0.2 * Math.sin(clock * 20); drawMouse(crashX, m.y, sy, t); ctx.globalCompositeOperation = 'source-over'; }
    ctx.globalAlpha = 1;

    sparks.forEach(p => {
      ctx.globalAlpha = 1 - (t - p.t) / SPARK_MS;
      ctx.fillStyle = p.c; disc(p.x, p.y, p.r);
    });
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    pops.forEach(o => {
      const age = (t - o.t) / POP_MS;
      ctx.globalAlpha = 0.8 * (1 - age); ctx.lineWidth = 3; ctx.strokeStyle = '#e0a93f';
      ctx.beginPath(); ctx.arc(BX, o.y, 12 + age * 26, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1 - age; ctx.font = `700 20px ${FONT}`; ctx.lineWidth = 4; ctx.strokeStyle = '#241a12'; ctx.fillStyle = '#f4e8c8';
      ctx.strokeText(`+${o.n}`, BX + 36, o.y - 16 - age * 26); ctx.fillText(`+${o.n}`, BX + 36, o.y - 16 - age * 26);
    });
    if (banner !== null) {
      const age = (t - banner.t) / BANNER_MS, text = banner.k === 'burst' ? tx.burst : `${tx.stage} ${stage + 1}`;
      if (banner.k === 'burst' && age < 0.15) { ctx.globalAlpha = 0.3 * (1 - age / 0.15); ctx.fillStyle = '#ffe9a8'; ctx.fillRect(0, 0, LW, WH); }
      ctx.globalAlpha = age < 0.15 ? age / 0.15 : 1 - (age - 0.15) / 0.85;
      ctx.font = `700 42px ${FONT}`;
      ctx.strokeStyle = '#241a12'; ctx.lineWidth = 8; ctx.strokeText(text, LW / 2, WH * 0.34);
      ctx.fillStyle = '#f4e8c8'; ctx.fillText(text, LW / 2, WH * 0.34);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  };

  let last = 0;
  const frame = t => {
    requestAnimationFrame(frame); // first, so one throwing frame cannot end the loop
    const dt = Math.min((t - last) / 1000, 1 / 30);
    last = t;
    if (started && !over && !helpOpen) step(dt, t);
    if (over && cause === 'unwound' && !helpOpen) { // the tower coasts to a stop
      slow = Math.max(0, slow - dt / 0.7);
      dist += speedAt(dist) * slow * dt;
    }
    if (over && !helpOpen) {
      crashX += (crashTx - crashX) * Math.min(1, dt * 14);
      if (crashX - crashTx < 3) {
        m.vy += ACC * dt; m.y += m.vy * dt;
        if (!landed && cause === 'crash') spin -= 12 * dt;
      }
      if (landed) spin += (Math.round(spin / TAU) * TAU - spin) * Math.min(1, dt * 14);
      if (m.y >= LANE_BOT && m.vy >= 0) { landed = true; m.y = LANE_BOT; m.vy = m.vy > 60 ? -m.vy * 0.35 : 0; }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (t - p.t > SPARK_MS) sparks.splice(i, 1);
    }
    for (let i = pops.length - 1; i >= 0; i--) if (t - pops[i].t > POP_MS) pops.splice(i, 1);
    if (banner !== null && t - banner.t > BANNER_MS) banner = null;
    shake = Math.max(0, shake - dt / 0.4);
    if (!helpOpen) render(t); // the help panel is opaque, so nothing behind it needs drawing
  };

  layout();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
