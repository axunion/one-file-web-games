<!DOCTYPE html>
<!-- World: jelly dessert shop - pastel gelatin colors on warm cream -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jelly Melody</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 5H23C27.5 5 30 7.5 31 12L31.5 21C31.8 25 30 27.5 27 27.5C24.5 27.5 23.5 26 22.5 24L21.5 22H10.5L9.5 24C8.5 26 7.5 27.5 5 27.5C2 27.5 0.2 25 0.5 21L1 12C2 7.5 4.5 5 9 5Z' fill='%23ff6b4a'/%3E%3Cpath d='M9 10.5v7M5.5 14h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='15.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='26' cy='12' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --bg: #fdf6f0; --ink: #5b4a52; --panel: #f1e4da; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; z-index: 1; left: 0; right: 0; top: 0; display: flex; align-items: stretch; gap: 6px;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);
    max-width: 560px; margin: 0 auto;
  }
  .box { flex: 1; background: var(--panel); border-radius: 14px; padding: 6px 10px; min-width: 0; }
  .box small { display: block; font-size: 11px; letter-spacing: .12em; opacity: .6; }
  .box b { font-size: 22px; line-height: 1.15; }
  button {
    width: 40px; border: 0; border-radius: 14px; background: var(--panel); color: var(--ink);
    padding: 0; display: grid; place-items: center; cursor: pointer;
  }
  button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  button svg .solid { fill: currentColor; stroke-width: 1.2; }
  .x { display: none; }
  #snd.off .x { display: inline; }
  #snd.off .wave { display: none; }
  button:active { transform: scale(.94); }
  #snd.off { opacity: .35; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 6vh);
    text-align: center; font-size: 18px; letter-spacing: .08em; opacity: .55; pointer-events: none;
  }
  #over {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; background: rgba(253, 246, 240, .82); cursor: pointer;
  }
  #over.show { display: flex; }
  #over h1 { margin: 0; font-size: 34px; letter-spacing: .08em; }
  #over p { margin: 0; font-size: 20px; }
  #over .tap { margin-top: 14px; font-size: 16px; opacity: .6; }
  #help {
    position: fixed; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; background: var(--bg);
    padding-bottom: calc(env(safe-area-inset-bottom) + 28px); /* the top and sides are set by placeHelp() */
  }
  #help.show { display: flex; }
  #hclose { position: fixed; }
  #help .langs { display: grid; flex: none; grid-template-columns: 1fr 1fr; width: 160px; height: 36px; gap: 8px; align-self: flex-start; }
  #help .langs button { width: auto; height: 100%; font: inherit; font-size: 14px; letter-spacing: .08em; }
  #help .langs button.on { background: #ffc4a8; font-weight: 700; }
  /* the body sits in a fixed-height box centred vertically, text top-aligned inside, so switching language moves nothing */
  #help .main { width: min(100%, 340px); flex: 1; min-height: 0; display: flex; align-items: center; padding-bottom: 40px; }
  #help .body { width: 100%; height: 430px; max-height: 100%; }
  #help h2 { margin: 0 0 16px; font-size: 30px; line-height: 44px; letter-spacing: .08em; }
  #help ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  #help li { padding: 10px 14px; background: var(--panel); border-radius: 14px; font-size: 15px; line-height: 1.65; text-wrap: pretty; word-break: auto-phrase; line-break: strict; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="box"><small data-t="score"></small><b id="score">0</b></div>
  <div class="box"><small data-t="best"></small><b id="best">0</b></div>
  <button id="rst" data-aria="restart"><svg viewBox="0 0 24 24"><path d="M19.05 14.57A7.5 7.5 0 1 1 15.75 5.5"/><path class="solid" d="M17.35 2.73L18.69 7.2L14.15 8.27Z"/></svg></button>
  <button id="snd" data-aria="sound"><svg viewBox="0 0 24 24"><path class="solid" d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.3a8 8 0 0 1 0 11.4"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <button id="qbtn" data-aria="help"><svg viewBox="0 0 24 24"><path d="M8.8 9.2a3.3 3.3 0 1 1 4.6 3c-.9.5-1.4 1-1.4 2"/><path d="M12 17.8v.1"/></svg></button>
</div>
<div id="hint" data-t="hint"></div>
<div id="over"><h1 data-t="over"></h1><p id="final"></p><p class="tap" data-t="retry"></p></div>
<div id="help">
  <div class="langs"><button data-l="en" lang="en">English</button><button data-l="ja" lang="ja">日本語</button></div>
  <div class="main"><div class="body"><h2 data-t="title"></h2><ul id="hlist"></ul></div></div>
  <button id="hclose" data-aria="close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
</div>

<script>
(() => {
  const N = 4;
  const KEY = 'ofwg:jelly-melody';
  const MOVE_MS = 110, CHAIN_MS = 130;
  const COLORS = ['#ffd6d1', '#ffc4a8', '#ffd88a', '#f4e27a', '#c5e384', '#93d9a8',
                  '#7fd6d0', '#86c3f0', '#9aa8f2', '#c09af0', '#f09ad0', '#ff7aa8'];
  const DARK = COLORS.map(hex => {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${[n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * 0.84))})`;
  });
  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  const FONT = 'ui-rounded, "Hiragino Maru Gothic ProN", system-ui, sans-serif';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $hud = document.getElementById('hud');
  const $hint = document.getElementById('hint');
  const $over = document.getElementById('over');
  const $final = document.getElementById('final');
  const $snd = document.getElementById('snd');

  const TEXT = {
    en: {
      title: 'How to play',
      hint: 'Swipe to merge',
      items: ['This is a merging game: join matching jellies into bigger ones for a high score.', 'Swipe, or use the arrow keys, and every jelly slides that way.', 'Jellies with the same number merge, and a merge next to a match chains on for more points.', 'The game is over when the board is full and no move is left.'],
      help: 'Help',
      close: 'Close',
      restart: 'Restart',
      sound: 'Sound',
      score: 'SCORE',
      best: 'BEST',
      over: 'NO MOVES',
      retry: 'Tap to retry',
      chain: n => `CHAIN ×${n}`,
      final: n => `Score ${n}`,
    },
    ja: {
      title: '遊び方',
      hint: 'スワイプで合体',
      items: ['同じ数字のゼリーを合体させて、ハイスコアを目指すゲームです。', 'スワイプ（または矢印キー）すると、すべてのゼリーがその向きに滑ります。', '同じ数字のゼリーは合体し、隣に同じ数字があると連鎖して高得点になります。', '盤面が埋まって動かせなくなると、ゲームオーバーです。'],
      help: 'ヘルプ',
      close: '閉じる',
      restart: 'リスタート',
      sound: 'サウンド',
      score: 'スコア',
      best: 'ベスト',
      over: '動かせない！',
      retry: 'タップでリトライ',
      chain: n => `${n}連鎖！`,
      final: n => `スコア ${n}`,
    },
  };
  const $help = document.getElementById('help');
  const $qbtn = document.getElementById('qbtn');
  const $hclose = document.getElementById('hclose');
  const $hlist = document.getElementById('hlist');
  const $langBar = document.querySelector('.langs');
  const $langs = $langBar.querySelectorAll('button');

  let tx;
  const setLang = l => {
    tx = TEXT[l];
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = tx[e.dataset.t]; });
    document.querySelectorAll('[data-aria]').forEach(e => e.setAttribute('aria-label', tx[e.dataset.aria]));
    $hlist.replaceChildren(...tx.items.map(t => Object.assign(document.createElement('li'), { textContent: t })));
    $langs.forEach(b => b.classList.toggle('on', b.dataset.l === l));
    if (over) renderOver();
    if (helpOpen) placeHelp(); // the HUD labels changed, so the ? may have moved
  };
  // the ? sits in the HUD row, whose position is only known at runtime: the close button copies its box,
  // the language switch is level with it, and the centred column's left edge mirrors its right edge
  const placeHelp = () => {
    const r = $qbtn.getBoundingClientRect(), barH = $langBar.offsetHeight, w = document.documentElement.clientWidth;
    Object.assign($hclose.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    $help.style.paddingTop = r.top + (r.height - barH) / 2 + 'px';
    $help.style.paddingInline = w - r.right + 'px';
  };
  let helpOpen = false;
  // inert keeps Tab and Enter from reaching the controls behind the panel
  const showHelp = open => {
    helpOpen = open;
    $help.classList.toggle('show', open);
    for (const el of [$hud, $over]) el.inert = open;
    if (open) { placeHelp(); $hclose.focus(); }
  };

  let grid, tiles, score, best = 0, over, overTimer, stage, pending, shake = 0;
  let particles = [], chainLabel = null;
  let W = 0, H = 0, dpr = 1, bx = 0, by = 0, bs = 0, pad = 0, cell = 0, gap = 0;

  try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) { /* storage unavailable */ }

  // muting silences a master gain, so tones already scheduled go quiet too
  let ac = null, master = null, muted = false;
  const audio = () => {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      master = ac.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  const tone = (a, freq, delay, dur, type, vol) => {
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  };
  // C major pentatonic across octaves, so any merge order stays consonant
  const PENT = [0, 2, 4, 7, 9];
  const noteFreq = lv => {
    const i = lv - 1;
    return 261.63 * Math.pow(2, (PENT[i % 5] + 12 * Math.floor(i / 5)) / 12);
  };
  const playMerge = (lv, step) => {
    const a = audio(); if (!a) return;
    const f = noteFreq(lv);
    tone(a, f, 0, 0.5, 'sine', 0.2);
    tone(a, f * 2, 0, 0.25, 'triangle', 0.07);
    if (step >= 2) tone(a, f * 1.5, 0, 0.45, 'sine', 0.1);
    if (step >= 3) tone(a, f * 2, 0.02, 0.45, 'sine', 0.1);
  };
  const playSlide = () => { const a = audio(); if (a) tone(a, 150, 0, 0.06, 'sine', 0.05); };
  const playOver = () => {
    const a = audio(); if (!a) return;
    [7, 4, 2, 0].forEach((s, i) => tone(a, 261.63 * Math.pow(2, s / 12), i * 0.16, 0.5, 'triangle', 0.15));
  };

  const now = () => performance.now();

  const newGame = () => {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    tiles = []; particles = []; chainLabel = null;
    score = 0; over = false; stage = null; pending = null;
    clearTimeout(overTimer);
    $over.classList.remove('show');
    spawn(); spawn();
    renderHud();
  };

  const renderHud = () => { $score.textContent = score; $best.textContent = best; };

  const spawn = () => {
    const empty = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const t = { lv: Math.random() < 0.9 ? 1 : 2, r, c, x: c, y: r, tw: null, spawnT: now(), popT: -1 };
    grid[r][c] = t; tiles.push(t);
  };

  const tween = (t, dur) => { t.tw = { fx: t.x, fy: t.y, t0: now(), dur }; };

  const lineCell = (dir, i, k) => {
    if (dir === 'left') return [i, k];
    if (dir === 'right') return [i, N - 1 - k];
    if (dir === 'up') return [k, i];
    return [N - 1 - k, i];
  };

  const slide = dir => {
    const merges = [];
    let moved = false;
    const next = Array.from({ length: N }, () => Array(N).fill(null));
    for (let i = 0; i < N; i++) {
      let pos = 0, last = null;
      for (let k = 0; k < N; k++) {
        const [r, c] = lineCell(dir, i, k);
        const t = grid[r][c];
        if (!t) continue;
        if (last && last.lv === t.lv) {
          merges.push({ keep: last, gone: t });
          t.r = last.r; t.c = last.c;
          moved = true;
          last = null;
        } else {
          const [nr, nc] = lineCell(dir, i, pos++);
          if (nr !== t.r || nc !== t.c) moved = true;
          t.r = nr; t.c = nc;
          next[nr][nc] = t;
          last = t;
        }
      }
    }
    if (!moved) return null;
    grid = next;
    tiles.forEach(t => { if (t.x !== t.c || t.y !== t.r) tween(t, MOVE_MS); });
    return merges;
  };

  const tryMove = dir => {
    if (over || helpOpen) return;
    if (stage) { pending = dir; return; }
    const merges = slide(dir);
    if (!merges) { shake = Math.max(shake, 3); return; }
    $hint.hidden = true;
    playSlide();
    stage = { until: now() + MOVE_MS, fn: () => resolve(merges, 1) };
  };

  const neighbors = (r, c) => [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]
    .filter(([y, x]) => y >= 0 && y < N && x >= 0 && x < N);

  const resolve = (merges, step) => {
    const active = [];
    for (const m of merges) {
      tiles.splice(tiles.indexOf(m.gone), 1);
      const k = m.keep;
      k.lv++; k.popT = now(); k.x = k.c; k.y = k.r; k.tw = null;
      score += (1 << k.lv) * step;
      playMerge(k.lv, step);
      burst(k, 6 + 4 * step);
      active.push(k);
    }
    shake = Math.max(shake, 2 + step * 2);
    if (navigator.vibrate) navigator.vibrate(step >= 2 ? 18 : 8);
    if (step >= 2) chainLabel = { n: step, t0: now() };
    if (score > best) {
      best = score;
      try { localStorage.setItem(KEY, String(best)); } catch (e) { /* storage unavailable */ }
    }
    renderHud();

    // chain: a freshly merged tile absorbs an adjacent tile of the same level
    const chain = [], used = new Set();
    for (const a of active) {
      if (used.has(a)) continue;
      for (const [r, c] of neighbors(a.r, a.c)) {
        const t = grid[r][c];
        if (t && !used.has(t) && t.lv === a.lv) {
          grid[r][c] = null;
          t.r = a.r; t.c = a.c;
          tween(t, CHAIN_MS);
          chain.push({ keep: a, gone: t });
          used.add(a); used.add(t);
          break;
        }
      }
    }
    if (chain.length) stage = { until: now() + CHAIN_MS, fn: () => resolve(chain, step + 1) };
    else finish();
  };

  const finish = () => {
    stage = null;
    spawn();
    if (!canMove()) { gameOver(); return; }
    if (pending) { const d = pending; pending = null; tryMove(d); }
  };

  const canMove = () => {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (!grid[r][c]) return true;
      if (neighbors(r, c).some(([y, x]) => grid[y][x] && grid[y][x].lv === grid[r][c].lv)) return true;
    }
    return false;
  };

  const renderOver = () => { $final.textContent = tx.final(score); };

  const gameOver = () => {
    over = true; pending = null;
    playOver();
    overTimer = setTimeout(() => {
      renderOver();
      $over.classList.add('show');
    }, 450);
  };

  const burst = (t, n) => {
    const cx = bx + pad + (t.c + 0.5) * cell, cy = by + pad + (t.r + 0.5) * cell;
    for (let i = 0; i < n && particles.length < 220; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 220;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color: COLORS[Math.min(t.lv - 1, COLORS.length - 1)], r: 2 + Math.random() * 4 });
    }
  };

  const rr = (x, y, w, h, r) => {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    bs = Math.min(W * 0.92, H * 0.6, 560);
    bx = (W - bs) / 2;
    by = Math.max(H * 0.5 - bs / 2 + 20, 100);
    pad = bs * 0.03; cell = (bs - pad * 2) / N; gap = bs * 0.025;
  };

  const update = (ts, dt) => {
    if (stage && ts >= stage.until) { const f = stage.fn; stage = null; f(); }
    for (const t of tiles) {
      if (!t.tw) continue;
      const p = Math.min(1, (ts - t.tw.t0) / t.tw.dur), e = 1 - Math.pow(1 - p, 3);
      t.x = t.tw.fx + (t.c - t.tw.fx) * e;
      t.y = t.tw.fy + (t.r - t.tw.fy) * e;
      if (p >= 1) t.tw = null;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.life -= dt / 520;
      if (q.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
      q.x += q.vx * dt / 1000; q.y += q.vy * dt / 1000;
      q.vx *= 0.94; q.vy = q.vy * 0.94 + 14;
    }
    shake *= Math.pow(0.86, dt / 16.7);
    if (shake < 0.05) shake = 0;
  };

  const drawTile = (t, ts) => {
    const cx = bx + pad + (t.x + 0.5) * cell, cy = by + pad + (t.y + 0.5) * cell;
    const size = cell - gap;
    let sx = 1, sy = 1;
    const sp = (ts - t.spawnT) / 260;
    if (sp < 1) sx = sy = Math.max(0, 1 + 2.9 * Math.pow(sp - 1, 3) + 1.9 * Math.pow(sp - 1, 2));
    const s = (ts - t.popT) / 1000;
    if (s < 0.8) {
      const d = Math.exp(-7 * s);
      const u = 1 + 0.18 * d * Math.cos(26 * s), q = 0.12 * d * Math.sin(26 * s);
      sx *= u * (1 + q); sy *= u * (1 - q);
    }
    if (t.tw) {
      const p = Math.min(1, (ts - t.tw.t0) / t.tw.dur), st = 0.1 * Math.sin(Math.PI * p);
      if (t.c !== t.tw.fx) { sx *= 1 + st; sy *= 1 - st * 0.6; } else { sy *= 1 + st; sx *= 1 - st * 0.6; }
    }
    const ci = Math.min(t.lv - 1, COLORS.length - 1);
    const w = size * sx, h = size * sy, rad = size * 0.26, lip = size * 0.07;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = 'rgba(91,74,82,0.10)';
    rr(-w / 2, -h / 2 + lip + size * 0.03, w, h, rad); ctx.fill();
    ctx.fillStyle = DARK[ci];
    rr(-w / 2, -h / 2 + lip, w, h - lip * 0.2, rad); ctx.fill();
    ctx.fillStyle = COLORS[ci];
    rr(-w / 2, -h / 2, w, h - lip, rad); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.beginPath();
    ctx.ellipse(-w * 0.12, -h * 0.3, w * 0.3, h * 0.1, -0.15, 0, Math.PI * 2);
    ctx.fill();
    const val = String(1 << t.lv);
    const fs = size * (val.length <= 2 ? 0.46 : val.length === 3 ? 0.38 : val.length === 4 ? 0.3 : 0.24);
    ctx.fillStyle = '#5b4a52';
    ctx.font = `700 ${fs * Math.min(sx, sy)}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(val, 0, -lip * 0.5);
    ctx.restore();
  };

  const draw = ts => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake) ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
    ctx.fillStyle = '#f1e4da';
    rr(bx, by, bs, bs, bs * 0.05); ctx.fill();
    ctx.fillStyle = '#e8d6ca';
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      rr(bx + pad + c * cell + gap / 2, by + pad + r * cell + gap / 2, cell - gap, cell - gap, cell * 0.24);
      ctx.fill();
    }
    for (const t of tiles) drawTile(t, ts);
    for (const q of particles) {
      ctx.globalAlpha = Math.max(0, q.life);
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r * q.life + 1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (chainLabel) {
      const p = (ts - chainLabel.t0) / 1000;
      if (p > 1) chainLabel = null;
      else {
        const s = 1 + 0.35 * Math.exp(-9 * p) * Math.cos(20 * p);
        ctx.save();
        ctx.globalAlpha = Math.min(1, (1 - p) * 2);
        ctx.translate(W / 2, by + bs + 44 - p * 14);
        ctx.scale(s, s);
        ctx.fillStyle = '#ff7aa8';
        ctx.font = `800 ${Math.min(30 + chainLabel.n * 4, 52)}px ${FONT}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(tx.chain(chainLabel.n), 0, 0);
        ctx.restore();
      }
    }
  };

  let last = 0;
  const frame = ts => {
    const dt = Math.min(ts - last || 16.7, 50);
    last = ts;
    update(ts, dt);
    draw(ts);
    requestAnimationFrame(frame);
  };

  let start = null;
  const THRESH = 24;
  window.addEventListener('pointerdown', e => {
    if (start || over || helpOpen || e.target.closest('button')) return;
    start = { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointermove', e => {
    if (!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < THRESH) return;
    start = null;
    tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  const endGesture = e => {
    if (start && e.pointerId === start.id) start = null;
    audio(); // touch pointerup counts as a user activation, unlike pointerdown
  };
  window.addEventListener('pointerup', endGesture);
  window.addEventListener('pointercancel', endGesture);
  window.addEventListener('keydown', e => {
    if (helpOpen) { if (e.key === 'Escape') showHelp(false); return; }
    const d = KEYS[e.key];
    if (d) { e.preventDefault(); tryMove(d); }
  });
  ['gesturestart', 'contextmenu', 'dblclick'].forEach(n => window.addEventListener(n, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  $over.addEventListener('click', newGame);
  document.getElementById('rst').addEventListener('click', newGame);
  $snd.addEventListener('click', () => {
    muted = !muted; $snd.classList.toggle('off', muted);
    if (master) master.gain.value = muted ? 0 : 1;
  });

  window.addEventListener('resize', resize);
  $qbtn.addEventListener('click', () => showHelp(true));
  $hclose.addEventListener('click', () => showHelp(false));
  $langs.forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));
  window.addEventListener('resize', () => { if (helpOpen) placeHelp(); });
  setLang(navigator.language.startsWith('ja') ? 'ja' : 'en');
  resize();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
