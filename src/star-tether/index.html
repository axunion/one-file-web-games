<!DOCTYPE html>
<!-- World: deep-space survey - a small delta-wing ship tethers glowing stars into constellations; neon star colors and thin line-art HUD on near-black indigo -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Star Tether</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 5H23C27.5 5 30 7.5 31 12L31.5 21C31.8 25 30 27.5 27 27.5C24.5 27.5 23.5 26 22.5 24L21.5 22H10.5L9.5 24C8.5 26 7.5 27.5 5 27.5C2 27.5 0.2 25 0.5 21L1 12C2 7.5 4.5 5 9 5Z' fill='%23ff6b4a'/%3E%3Cpath d='M9 10.5v7M5.5 14h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='15.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='26' cy='12' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --night: #070a1c; --star: #e8f1ff; --glow: #4de1ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--star);
    font-family: "Futura", "Avenir Next", "Century Gothic", "Trebuchet MS", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  body { padding-bottom: env(safe-area-inset-bottom); } /* read back in layout() as a px value */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; z-index: 1; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);
    max-width: 560px; margin: 0 auto;
  }
  #rst { justify-self: start; }
  .ctl { display: flex; gap: 8px; justify-self: end; }
  #tally { text-align: center; }
  #tally b {
    display: block; font-size: 40px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px rgba(77, 225, 255, .6);
  }
  #tally small {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px;
    font-size: 11px; letter-spacing: .24em; color: var(--glow);
  }
  #tally small::before, #tally small::after { content: ''; width: 16px; height: 1px; background: rgba(77, 225, 255, .5); }
  /* viewfinder corners instead of a border */
  button {
    --corner: linear-gradient(var(--glow), var(--glow));
    width: 42px; height: 42px; border: 0; padding: 0; color: var(--glow); cursor: pointer;
    display: grid; place-items: center; background-color: rgba(77, 225, 255, .07);
    background-image: var(--corner), var(--corner), var(--corner), var(--corner), var(--corner), var(--corner), var(--corner), var(--corner);
    background-repeat: no-repeat;
    background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%;
    background-size: 10px 2px, 2px 10px, 10px 2px, 2px 10px, 10px 2px, 2px 10px, 10px 2px, 2px 10px;
  }
  button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  button svg .solid { fill: currentColor; stroke-width: 1.2; }
  .x { display: none; }
  #snd.off .x { display: inline; }
  #snd.off .wave { display: none; }
  button:active { background-color: rgba(77, 225, 255, .24); }
  #snd.off { opacity: .35; }
  #hint {
    position: fixed; left: 50%; top: 38%; transform: translateX(-50%); width: max-content; max-width: 88vw;
    padding: 8px 18px; border: 1px solid rgba(77, 225, 255, .55); border-radius: 4px; background: rgba(7, 10, 28, .82);
    text-align: center; font-size: 14px; line-height: 1.4; letter-spacing: .12em; text-transform: uppercase; pointer-events: none;
  }
  #over {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(7, 10, 28, .88); cursor: pointer;
  }
  #over.show { display: flex; }
  #over h1 {
    margin: 0; font-size: 30px; font-weight: 700; letter-spacing: .2em; color: #ff5a6e;
    text-shadow: 0 0 16px rgba(255, 90, 110, .6);
  }
  #over p { margin: 0; font-size: 26px; letter-spacing: .08em; }
  #over .tap {
    padding: 6px 18px; border-radius: 999px; border: 1.5px solid var(--glow);
    font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: var(--glow);
  }
  #help {
    position: fixed; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; background: var(--night);
    padding-bottom: calc(env(safe-area-inset-bottom) + 28px); /* the top and sides are set by placeHelp() */
  }
  #help.show { display: flex; }
  #hclose { position: fixed; }
  #help .langs { display: grid; flex: none; grid-template-columns: 1fr 1fr; width: 160px; height: 36px; gap: 8px; align-self: flex-start; }
  #help .langs button { width: auto; height: 100%; font: inherit; font-size: 12px; letter-spacing: .16em; }
  #help .langs button.on { background-color: rgba(77, 225, 255, .28); }
  /* the body sits in a fixed-height box centred vertically, text top-aligned inside, so switching language moves nothing */
  #help .main { width: min(100%, 340px); flex: 1; min-height: 0; display: flex; align-items: center; padding-bottom: 40px; }
  #help .body { width: 100%; height: 410px; max-height: 100%; }
  #help h2 {
    margin: 0 0 24px; font-size: 22px; line-height: 44px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
    color: var(--glow); text-shadow: 0 0 14px rgba(77, 225, 255, .5);
  }
  #help ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 20px; }
  #help li { padding-left: 16px; border-left: 1px solid rgba(77, 225, 255, .5); font-size: 15px; line-height: 1.7; letter-spacing: .03em; text-wrap: pretty; word-break: auto-phrase; line-break: strict; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <button id="rst" data-aria="restart"><svg viewBox="0 0 24 24"><path d="M19.05 14.57A7.5 7.5 0 1 1 15.75 5.5"/><path class="solid" d="M17.35 2.73L18.69 7.2L14.15 8.27Z"/></svg></button>
  <div id="tally"><b id="score">0</b><small><span data-t="best"></span> <span id="best">0</span></small></div>
  <div class="ctl">
  <button id="snd" data-aria="sound"><svg viewBox="0 0 24 24"><path class="solid" d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.3a8 8 0 0 1 0 11.4"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <button id="qbtn" data-aria="help"><svg viewBox="0 0 24 24"><path d="M8.8 9.2a3.3 3.3 0 1 1 4.6 3c-.9.5-1.4 1-1.4 2"/><path d="M12 17.8v.1"/></svg></button>
  </div>
</div>
<div id="hint" data-t="hint"></div>
<div id="over"><h1 data-t="over"></h1><p id="final"></p><p class="tap" data-t="retry"></p></div>
<div id="help">
  <div class="langs"><button data-l="en" lang="en">English</button><button data-l="ja" lang="ja">日本語</button></div>
  <div class="main"><div class="body"><h2 data-t="title"></h2><ul id="hlist"></ul></div></div>
  <button id="hclose" data-aria="close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
</div>

<script>
(() => {
  const COLS = 11, ROWS = 18;
  const KEY = 'ofwg:star-tether';
  const FOODS = 6, SWIPE_PX = 16, EDGE_WEIGHT = 0.5;
  // step time falls from START_MS to MIN_MS as stars are collected; the fourth color joins later
  const START_MS = 250, MIN_MS = 150, RAMP_MS = 2.5;
  const START_COLORS = 3, UNLOCK_EATEN = 10;
  const PARTICLE_MS = 600, GHOST_MS = 260, RING_MS = 320, POPUP_MS = 700, LINK_MS = 450;
  // in cells: free stars are bigger than the ones locked into the chain, which leaves room for the tether line, and the line stops at a chain star's edge
  const STAR_R = 0.4, CHAIN_R = 0.3;
  const PALETTE = ['#4de1ff', '#ff5fd2', '#b6ff5c', '#ffc93c', '#e8f1ff'];
  const HEAD = PALETTE.length - 1;
  // each color is its own star shape, so the chain reads without relying on hue alone;
  // k evens out how large each shape looks at the same radius
  const SHAPES = [
    { n: 8, inner: 0.36, k: 1.15 }, // sparkle
    { n: 10, inner: 0.46, k: 1.05 }, // five-point star
    { n: 6, inner: 1, k: 0.95 }, // hexagon
    { n: 3, inner: 1, k: 1.1 } // triangle
  ];
  // faint sign outlines on the backdrop, in cell coordinates
  const SIGNS = [
    [[1.2, 2.4], [2.8, 3.2], [4.2, 2.8], [5.6, 3.9], [7.9, 3.6], [7.6, 5.3], [5.4, 5.6], [5.6, 3.9]],
    [[5.5, 9], [6.7, 10.4], [8, 9.2], [9.2, 10.8], [10, 9.4]]
  ];
  const DARK = PALETTE.map(hex => {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${[n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * 0.62))})`;
  });
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right'
  };
  const FONT = '"Futura", "Avenir Next", "Century Gothic", "Trebuchet MS", sans-serif';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $hud = document.getElementById('hud');
  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $hint = document.getElementById('hint');
  const $over = document.getElementById('over');
  const $final = document.getElementById('final');
  const $snd = document.getElementById('snd');

  const TEXT = {
    en: {
      title: 'How to play',
      hint: 'Swipe to start · match 3',
      items: ['The goal is to collect stars and burst them for a high score.', 'Swipe, or use the arrow keys, and the ship turns that way.', 'Collected stars join the chain behind the ship, and three of the same color in a row burst for bonus points.', 'The game is over when the ship hits the board edge or its own chain.'],
      help: 'Help',
      close: 'Close',
      restart: 'Restart',
      sound: 'Sound',
      best: 'BEST',
      over: 'SIGNAL LOST',
      retry: 'Tap to retry',
      final: n => `${n} pts`,
    },
    ja: {
      title: '遊び方',
      hint: 'スワイプで開始・同じ色を3つ',
      items: ['星を集めて弾けさせ、ハイスコアを目指すゲームです。', 'スワイプ（または矢印キー）すると、船がその向きに曲がります。', '集めた星は船の後ろにつながり、同じ色が3つ並ぶと弾けてボーナス得点になります。', '盤面の端か、自分の鎖にぶつかるとゲームオーバーです。'],
      help: 'ヘルプ',
      close: '閉じる',
      restart: 'リスタート',
      sound: 'サウンド',
      best: 'ベスト',
      over: 'シグナルロスト',
      retry: 'タップでリトライ',
      final: n => `${n}点`,
    },
  };
  const $help = document.getElementById('help');
  const $qbtn = document.getElementById('qbtn');
  const $hclose = document.getElementById('hclose');
  const $hlist = document.getElementById('hlist');
  const $langBar = document.querySelector('.langs');
  const $langs = $langBar.querySelectorAll('button');

  let tx;
  const setLang = l => {
    tx = TEXT[l];
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = tx[e.dataset.t]; });
    document.querySelectorAll('[data-aria]').forEach(e => e.setAttribute('aria-label', tx[e.dataset.aria]));
    $hlist.replaceChildren(...tx.items.map(t => Object.assign(document.createElement('li'), { textContent: t })));
    $langs.forEach(b => b.classList.toggle('on', b.dataset.l === l));
    if (over) renderOver();
    if (helpOpen) placeHelp(); // the HUD labels changed, so the ? may have moved
  };
  // the ? sits in the HUD row, whose position is only known at runtime: the close button copies its box,
  // the language switch is level with it, and the centred column's left edge mirrors its right edge
  const placeHelp = () => {
    const r = $qbtn.getBoundingClientRect(), barH = $langBar.offsetHeight, w = document.documentElement.clientWidth;
    Object.assign($hclose.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    $help.style.paddingTop = r.top + (r.height - barH) / 2 + 'px';
    $help.style.paddingInline = w - r.right + 'px';
  };
  let helpOpen = false;
  // inert keeps Tab and Enter from reaching the controls behind the panel
  const showHelp = open => {
    helpOpen = open;
    $help.classList.toggle('show', open);
    for (const el of [$hud, $over]) el.inert = open;
    if (open) { placeHelp(); $hclose.focus(); }
  };

  // cells holds one cell per star, head first. Between steps each star slides along the
  // tether's route: it sits `off` cells behind its cell and closes that gap as the step
  // progresses. trail keeps the cells just past the tail that a sliding star may still
  // be passing through, and path is cells + trail, which is what rendering reads.
  let cells, trail, path, segs, foods, dir, queue, started, over, overTimer, score, best = 0, eaten, acc;
  let particles, ghosts, popups, rings, links, eatAt, shake;
  let W = 0, H = 0, dpr = 1, bx = 0, by = 0, cell = 0, nebula = [], brackets, sky, skyDots, board, popFont;
  const PX = new Float32Array(COLS * ROWS), PY = new Float32Array(COLS * ROWS);
  const dust = Array.from({ length: 36 }, () => ({
    x: Math.random() * COLS, y: Math.random() * ROWS, v: 0.15 + Math.random() * 0.45,
    r: 0.025 + Math.random() * 0.04, ph: Math.random() * 6.3
  }));

  try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) { /* storage unavailable */ }

  // muting silences a master gain, so tones already scheduled go quiet too
  let ac = null, master = null, muted = false;
  const audio = () => {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      master = ac.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  const tone = (a, freq, delay, dur, type, vol) => {
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  };
  // each color owns one pentatonic note, so eating also tells which color went in
  const PENT = [0, 2, 4, 7];
  const semi = (base, steps) => base * Math.pow(2, steps / 12);
  const playEat = ci => { const a = audio(); if (a) tone(a, semi(392, PENT[ci]), 0, 0.14, 'triangle', 0.12); };
  const playPop = ci => {
    const a = audio(); if (!a) return;
    const f = semi(392, PENT[ci]);
    tone(a, f, 0, 0.4, 'sine', 0.2);
    tone(a, f * 1.26, 0.07, 0.4, 'sine', 0.15);
    tone(a, f * 1.5, 0.14, 0.5, 'sine', 0.15);
    tone(a, f * 2, 0.14, 0.3, 'triangle', 0.06);
  };
  const playOver = () => {
    const a = audio(); if (!a) return;
    [7, 4, 2, 0].forEach((s, i) => tone(a, semi(261.63, s), i * 0.16, 0.5, 'triangle', 0.15));
  };

  const rnd = n => Math.floor(Math.random() * n);
  const at = (list, x, y) => list.some(c => c.x === x && c.y === y);
  const expire = (list, t, life) => {
    for (let i = list.length - 1; i >= 0; i--) if (t - list[i].t > life) list.splice(i, 1);
  };
  const stepMs = () => Math.max(MIN_MS, START_MS - eaten * RAMP_MS);

  const spawnFood = t => {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (at(cells, x, y) || at(trail, x, y)) continue;
        if (!at(foods, x, y)) free.push({ x, y });
      }
    }
    if (!free.length) return;
    // border cells are less likely: a star next to a wall is risky to take, so unweighted ones pile up there
    const weight = c => (c.x === 0 || c.y === 0 || c.x === COLS - 1 || c.y === ROWS - 1 ? EDGE_WEIGHT : 1);
    let pick = Math.random() * free.reduce((sum, c) => sum + weight(c), 0);
    const p = free.find(c => (pick -= weight(c)) < 0) || free[free.length - 1];
    // keep the color on top of the stack on the board, so a run of three is always reachable
    const top = segs.length > 1 ? segs[1].c : -1;
    const ncolors = eaten >= UNLOCK_EATEN ? PALETTE.length - 1 : START_COLORS;
    const c = top >= 0 && !foods.some(f => f.c === top) ? top : rnd(ncolors);
    foods.push({ x: p.x, y: p.y, c, born: t });
  };

  const newGame = () => {
    const x = COLS >> 1, y = ROWS - 4;
    cells = [{ x, y }, { x, y: y + 1 }, { x, y: y + 2 }];
    trail = []; path = cells;
    segs = cells.map((c, i) => ({ c: i ? rnd(START_COLORS) : HEAD, off: 0, born: -1e9 }));
    foods = []; particles = []; ghosts = []; popups = []; rings = []; links = [];
    queue = []; dir = 'up'; started = false; over = false;
    score = 0; eaten = 0; acc = 0; eatAt = -1e9; shake = 0;
    clearTimeout(overTimer);
    $over.classList.remove('show');
    $hint.style.display = '';
    // born far in the past: a clock read here can land after the next frame's timestamp and give a negative scale
    while (foods.length < FOODS) spawnFood(-1e9);
    renderHud();
  };

  const renderHud = () => { $score.textContent = score; $best.textContent = best; };

  const popRun = (t, ci) => {
    links.push({ pts: cells.slice(1, 4).map(c => ({ x: c.x, y: c.y })), t });
    segs.splice(1, 3).forEach((s, i) => {
      const c = cells[1 + i];
      ghosts.push({ x: c.x, y: c.y, c: s.c, t });
      for (let k = 0; k < 8; k++) {
        const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 3;
        particles.push({ x: c.x, y: c.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, c: s.c, t });
      }
    });
    // the stars behind the gap slide forward along the old path
    segs.forEach((s, i) => { if (i) s.off = 3; });
    trail = cells.slice(segs.length);
    cells.length = segs.length;
    score += 30;
    popups.push({ x: cells[0].x, y: cells[0].y, t });
    playPop(ci);
  };

  const renderOver = () => { $final.textContent = tx.final(score); };

  const die = () => {
    over = true; shake = 1;
    playOver();
    renderOver();
    overTimer = setTimeout(() => $over.classList.add('show'), 700);
  };

  const step = t => {
    if (queue.length) dir = queue.shift();
    const nx = cells[0].x + DIRS[dir][0], ny = cells[0].y + DIRS[dir][1];
    const fi = foods.findIndex(f => f.x === nx && f.y === ny);
    // the tail cell is vacated this step unless the head eats
    const solid = fi >= 0 ? cells : cells.slice(0, -1);
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || at(solid, nx, ny)) return die();
    cells.unshift({ x: nx, y: ny });
    segs.forEach((s, i) => { s.off = fi >= 0 && i ? 0 : 1; });
    if (fi < 0) { trail = [cells.pop()]; return; }

    // the star joins right behind the head, in the cell the head just left
    trail = [];
    const f = foods.splice(fi, 1)[0];
    segs.splice(1, 0, { c: f.c, off: 0, born: t });
    rings.push({ x: cells[1].x, y: cells[1].y, c: f.c, t });
    eaten++; score += 10; eatAt = t;
    playEat(f.c);
    if (segs.length >= 4 && segs[2].c === f.c && segs[3].c === f.c) popRun(t, f.c);
    spawnFood(t);
    if (score > best) {
      best = score;
      try { localStorage.setItem(KEY, String(best)); } catch (e) { /* storage unavailable */ }
    }
    renderHud();
  };

  const start = () => {
    if (started || helpOpen) return;
    started = true; acc = 0;
    $hint.style.display = 'none';
  };

  const turn = d => {
    if (over || helpOpen) return;
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (OPP[ref] === d) return;
    start();
    if (d !== ref && queue.length < 2) queue.push(d);
  };

  let px = 0, py = 0, pid = null, swiped = false;
  cv.addEventListener('pointerdown', e => {
    if (pid !== null) return;
    pid = e.pointerId; swiped = false; px = e.clientX; py = e.clientY;
    cv.setPointerCapture(pid);
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    const dx = e.clientX - px, dy = e.clientY - py;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_PX) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    px = e.clientX; py = e.clientY; swiped = true;
  });
  cv.addEventListener('pointerup', e => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (!swiped && !over) start();
    audio(); // touch pointerup counts as a user activation, unlike pointerdown
  });
  cv.addEventListener('pointercancel', e => { if (e.pointerId === pid) pid = null; });
  ['gesturestart', 'contextmenu', 'dblclick'].forEach(n => window.addEventListener(n, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  window.addEventListener('keydown', e => {
    if (helpOpen) { if (e.key === 'Escape') showHelp(false); return; }
    const d = KEYS[e.key];
    if (!d) return;
    e.preventDefault();
    audio();
    turn(d);
  });

  $qbtn.addEventListener('click', () => showHelp(true));
  $hclose.addEventListener('click', () => showHelp(false));
  $langs.forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));
  window.addEventListener('resize', () => { if (helpOpen) placeHelp(); });
  setLang(navigator.language.startsWith('ja') ? 'ja' : 'en');

  $over.addEventListener('click', newGame);
  document.getElementById('rst').addEventListener('click', newGame);
  $snd.addEventListener('click', () => {
    muted = !muted;
    $snd.classList.toggle('off', muted);
    if (master) master.gain.value = muted ? 0 : 1;
    audio();
  });

  const layout = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const top = $hud.getBoundingClientRect().bottom + 12, bottom = 24 + (parseFloat(getComputedStyle(document.body).paddingBottom) || 0);
    const availH = H - top - bottom;
    cell = Math.max(1, Math.floor(Math.min((W - 12) / COLS, availH / ROWS, 64)));
    bx = (W - cell * COLS) / 2;
    by = top + (availH - cell * ROWS) / 2;
    board = new Path2D();
    board.roundRect(0, 0, cell * COLS, cell * ROWS, cell * 0.3);
    popFont = `700 ${cell * 0.6}px ${FONT}`;
    const w = cell * COLS, h = cell * ROWS;
    nebula = [[0, 0, '150,90,255', 0.38], [w, h * 0.62, '40,200,255', 0.2], [w * 0.2, h, '255,80,200', 0.16]].map(([x, y, rgb, a]) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, w * 0.9);
      g.addColorStop(0, `rgba(${rgb},${a})`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      return g;
    });
    // viewfinder brackets just outside the board's corners
    brackets = new Path2D();
    const o = cell * 0.1, l = cell * 0.9;
    [[0, 0, 1, 1], [w, 0, -1, 1], [0, h, 1, -1], [w, h, -1, -1]].forEach(([x, y, sx, sy]) => {
      brackets.moveTo(x - sx * o + sx * l, y - sy * o);
      brackets.lineTo(x - sx * o, y - sy * o);
      brackets.lineTo(x - sx * o, y - sy * o + sy * l);
    });
    sky = new Path2D(); skyDots = new Path2D();
    SIGNS.forEach(pts => pts.forEach(([x, y], i) => {
      if (i) sky.lineTo(x * cell, y * cell); else sky.moveTo(x * cell, y * cell);
      skyDots.moveTo(x * cell + cell * 0.07, y * cell); skyDots.arc(x * cell, y * cell, cell * 0.07, 0, Math.PI * 2);
    }));
  };
  window.addEventListener('resize', layout);

  const update = (dt, t) => {
    const s = dt / 1000;
    particles.forEach(p => { p.vy += 14 * s; p.x += p.vx * s; p.y += p.vy * s; });
    expire(particles, t, PARTICLE_MS);
    expire(ghosts, t, GHOST_MS);
    expire(popups, t, POPUP_MS);
    expire(rings, t, RING_MS);
    expire(links, t, LINK_MS);
    dust.forEach(e => {
      e.y += e.v * s;
      if (e.y > ROWS + 0.3) { e.y = -0.3; e.x = Math.random() * COLS; }
    });
    shake = Math.max(0, shake - dt / 400);
  };

  const disc = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };

  const poly = (x, y, r, ci, rot, style) => {
    const { n, inner, k } = SHAPES[ci], rad = r * k;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot - Math.PI / 2 + i * Math.PI * 2 / n, d = i & 1 ? rad * inner : rad;
      if (i) ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); else ctx.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
    }
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle = style;
    ctx.fill(); ctx.stroke();
  };

  // gx/gy are grid coordinates, r is in cells
  const star = (gx, gy, r, ci, scale, rot = 0) => {
    const x = (gx + 0.5) * cell, y = (gy + 0.5) * cell, rad = r * cell * scale, a = ctx.globalAlpha;
    ctx.lineJoin = 'round'; ctx.lineWidth = cell * 0.05;
    ctx.globalAlpha = a * 0.18; poly(x, y, rad * 1.45, ci, rot, PALETTE[ci]);
    ctx.globalAlpha = a; poly(x, y, rad, ci, rot, DARK[ci]);
    poly(x, y, rad * 0.8, ci, rot, PALETTE[ci]);
    ctx.globalAlpha = a * 0.9; ctx.fillStyle = '#fff'; disc(x, y, rad * 0.16);
    ctx.globalAlpha = a;
  };

  // a plain delta-wing ship with no face, so the head never reads as one of the collectible star shapes
  const ship = (r, t) => {
    const [dx, dy] = DIRS[dir];
    const pop = over ? 0 : Math.max(0, 1 - (t - eatAt) / 180);
    ctx.save();
    ctx.translate((PX[0] + 0.5) * cell, (PY[0] + 0.5) * cell);
    ctx.rotate(Math.atan2(dy, dx));
    ctx.scale(1 + 0.15 * pop, 1 + 0.15 * pop);
    if (!over) {
      const flame = r * (0.45 + 0.2 * Math.sin(t / 45));
      ctx.fillStyle = 'rgba(155,232,255,.85)';
      ctx.beginPath(); ctx.moveTo(-r * 0.35, -r * 0.2); ctx.lineTo(-r * 0.35 - flame, 0); ctx.lineTo(-r * 0.35, r * 0.2); ctx.fill();
    }
    ctx.fillStyle = over ? '#ff5a6e' : PALETTE[HEAD];
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(-r * 0.7, -r * 0.75); ctx.lineTo(-r * 0.35, 0); ctx.lineTo(-r * 0.7, r * 0.75);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = over ? '#3a1020' : pop > 0 ? '#fff' : PALETTE[0];
    ctx.beginPath(); ctx.ellipse(r * 0.15, 0, r * 0.32, r * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };

  const render = (t, p) => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(bx + (Math.random() - 0.5) * 8 * shake, by + (Math.random() - 0.5) * 8 * shake);

    ctx.save();
    ctx.clip(board);
    ctx.fillStyle = '#0a0e26';
    ctx.fillRect(0, 0, cell * COLS, cell * ROWS);
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(t / 1200);
    nebula.forEach(g => { ctx.fillStyle = g; ctx.fillRect(0, 0, cell * COLS, cell * ROWS); });
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(150,190,255,.13)'; ctx.lineWidth = 1.5;
    ctx.stroke(sky);
    ctx.fillStyle = 'rgba(190,220,255,.35)';
    ctx.fill(skyDots);
    ctx.restore();
    ctx.strokeStyle = 'rgba(77,225,255,.2)'; ctx.lineWidth = 1;
    ctx.stroke(board);
    ctx.strokeStyle = '#4de1ff'; ctx.lineWidth = 2.5; ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
    ctx.stroke(brackets);

    ctx.fillStyle = '#dbe8ff';
    dust.forEach(e => {
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t / 400 + e.ph);
      disc(e.x * cell, e.y * cell, cell * e.r);
    });
    ctx.globalAlpha = 1;

    foods.forEach(f => {
      const s = Math.min(1, (t - f.born) / 200);
      const bob = Math.sin(t / 260 + f.x * 1.7 + f.y) * 0.05;
      star(f.x, f.y + bob, STAR_R, f.c, s, Math.sin(t / 700 + f.x + f.y * 1.3) * 0.25);
    });

    const n = segs.length;
    // p is the progress (0..1) of the current step
    for (let i = 0; i < n; i++) {
      const u = i + segs[i].off * (1 - p), k = Math.floor(u), f = u - k;
      const a = path[k], b = f > 1e-6 ? path[k + 1] : a;
      PX[i] = a.x + (b.x - a.x) * f;
      PY[i] = a.y + (b.y - a.y) * f;
    }
    // like a constellation diagram, the line only spans the gap between two stars
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < n - 1; i++) {
      const dx = PX[i + 1] - PX[i], dy = PY[i + 1] - PY[i], len = Math.hypot(dx, dy);
      if (len < 2 * CHAIN_R + 0.05) continue;
      const u = CHAIN_R / len;
      ctx.moveTo((PX[i] + 0.5 + dx * u) * cell, (PY[i] + 0.5 + dy * u) * cell);
      ctx.lineTo((PX[i + 1] + 0.5 - dx * u) * cell, (PY[i + 1] + 0.5 - dy * u) * cell);
    }
    ctx.strokeStyle = 'rgba(160,215,255,.22)'; ctx.lineWidth = cell * 0.14; ctx.stroke();
    ctx.strokeStyle = '#d6eeff'; ctx.lineWidth = cell * 0.045; ctx.stroke();

    // the head (index 0) is the ship, drawn below
    for (let i = n - 1; i > 0; i--) {
      // a star that just joined overshoots to about 1.17 before settling (ease-out-back)
      const k = Math.min(1, (t - segs[i].born) / 300) - 1;
      star(PX[i], PY[i], CHAIN_R, segs[i].c, 0.3 + 0.7 * (1 + 4 * k * k * k + 3 * k * k));
    }
    ship(0.5 * cell, t);

    // the matched run flashes as one bright line before its stars burst
    ctx.strokeStyle = '#fff'; ctx.lineWidth = cell * 0.12;
    links.forEach(l => {
      ctx.globalAlpha = 1 - (t - l.t) / LINK_MS;
      ctx.beginPath();
      l.pts.forEach((c, i) => {
        const x = (c.x + 0.5) * cell, y = (c.y + 0.5) * cell;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      });
      ctx.stroke();
    });
    ghosts.forEach(g => {
      const k = (t - g.t) / GHOST_MS;
      ctx.globalAlpha = 1 - k;
      star(g.x, g.y, CHAIN_R, g.c, 1 + 0.5 * k);
    });
    ctx.globalAlpha = 1;

    ctx.lineWidth = cell * 0.08;
    rings.forEach(r => {
      const k = (t - r.t) / RING_MS;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = PALETTE[r.c];
      ctx.beginPath(); ctx.arc((r.x + 0.5) * cell, (r.y + 0.5) * cell, cell * (0.5 + 0.7 * k), 0, Math.PI * 2); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    particles.forEach(q => {
      ctx.globalAlpha = 1 - (t - q.t) / PARTICLE_MS;
      ctx.fillStyle = PALETTE[q.c];
      disc((q.x + 0.5) * cell, (q.y + 0.5) * cell, cell * 0.09);
    });
    ctx.globalAlpha = 1;

    if (popups.length) {
      ctx.font = popFont;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = cell * 0.12; ctx.lineJoin = 'round';
      popups.forEach(q => {
        const age = (t - q.t) / POPUP_MS;
        ctx.globalAlpha = 1 - age;
        const x = (q.x + 0.5) * cell, y = (q.y - age * 1.2) * cell;
        ctx.strokeStyle = '#070a1c'; ctx.strokeText('+30', x, y);
        ctx.fillStyle = '#e8f1ff'; ctx.fillText('+30', x, y);
      });
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  };

  let last = 0;
  const frame = t => {
    requestAnimationFrame(frame); // first, so one throwing frame cannot end the loop
    const dt = Math.min(t - last, 50);
    last = t;
    if (started && !over && !helpOpen) {
      acc += dt;
      const ms = stepMs();
      while (acc >= ms && !over) { acc -= ms; step(t); path = cells.concat(trail); }
    }
    update(dt, t);
    render(t, started && !over ? Math.min(1, acc / stepMs()) : 1);
  };

  layout();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
