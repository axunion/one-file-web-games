<!DOCTYPE html>
<!-- World: sunset canyon - a small indigo swift skims between terracotta cliff walls under a coral-to-amber sky, with violet ridges behind; the sky slides toward dusk plum as the run goes on -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Swift Run</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 5H23C27.5 5 30 7.5 31 12L31.5 21C31.8 25 30 27.5 27 27.5C24.5 27.5 23.5 26 22.5 24L21.5 22H10.5L9.5 24C8.5 26 7.5 27.5 5 27.5C2 27.5 0.2 25 0.5 21L1 12C2 7.5 4.5 5 9 5Z' fill='%23ff6b4a'/%3E%3Cpath d='M9 10.5v7M5.5 14h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='15.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='26' cy='12' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --plum: #2d1b3d; --amber: #ffc46b; --cream: #fff3dc; --coral: #ff7a66; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--plum); color: var(--cream);
    font-family: "Avenir Next", "Hiragino Kaku Gothic ProN", "Helvetica Neue", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; z-index: 1; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);
    max-width: 560px; margin: 0 auto; pointer-events: none; /* taps on the empty HUD strip still reach the canvas */
  }
  #hud button { pointer-events: auto; }
  .ctl { display: flex; gap: 8px; justify-self: end; }
  #tally { text-align: center; }
  #tally b {
    display: block; font-size: 46px; line-height: 1; font-weight: 800; font-style: italic; font-variant-numeric: tabular-nums;
    -webkit-text-stroke: 5px var(--plum); paint-order: stroke fill;
  }
  #tally small {
    display: inline-block; margin-top: 6px; padding: 2px 8px; font-size: 11px; font-weight: 800; letter-spacing: .2em; background: var(--plum); transform: skewX(-8deg);
  }
  button {
    width: 42px; height: 42px; border: 0; border-radius: 10px 4px; padding: 0; color: var(--plum); cursor: pointer;
    display: grid; place-items: center; background: var(--amber); transform: skewX(-8deg);
  }
  button:active { background: var(--cream); }
  button svg { transform: skewX(8deg); width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  button svg .solid { fill: currentColor; stroke-width: 1.2; }
  .x { display: none; }
  #snd.off .x { display: inline; }
  #snd.off .wave { display: none; }
  #snd.off { opacity: .5; }
  #hint {
    position: fixed; left: 50%; top: 24%; transform: translateX(-50%); width: max-content; max-width: 88vw;
    padding: 10px 20px; border-radius: 6px; background: rgba(45, 27, 61, .78); border-left: 4px solid var(--coral);
    text-align: center; font-size: 15px; font-weight: 800; line-height: 1.4; letter-spacing: .04em; pointer-events: none;
  }
  #over {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(45, 27, 61, .82); cursor: pointer;
  }
  #over.show { display: flex; }
  #over h1 { margin: 0; font-size: 46px; font-weight: 800; font-style: italic; letter-spacing: .03em; color: var(--coral); padding-left: 14px; border-left: 6px solid var(--amber); }
  #over p { margin: 0; font-size: 26px; font-weight: 800; }
  #over .tap { padding: 8px 20px; border-radius: 6px; background: var(--amber); color: var(--plum); font-size: 16px; }
  #help {
    position: fixed; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; background: var(--plum);
    padding-bottom: calc(env(safe-area-inset-bottom) + 28px); /* the top and sides are set by placeHelp() */
  }
  #help.show { display: flex; }
  #hclose { position: fixed; }
  #help .langs { display: grid; flex: none; grid-template-columns: 1fr 1fr; width: 160px; height: 36px; gap: 8px; align-self: flex-start; }
  #help .langs button { width: auto; height: 100%; font: inherit; font-size: 13px; font-weight: 800; background: rgba(255, 196, 107, .18); color: var(--amber); }
  #help .langs button.on { background: var(--amber); color: var(--plum); }
  /* the body sits in a fixed-height box centred vertically, text top-aligned inside, so switching language moves nothing */
  #help .main { width: min(100%, 340px); flex: 1; min-height: 0; display: flex; align-items: center; padding-bottom: 40px; }
  #help .body { width: 100%; height: 430px; max-height: 100%; }
  #help h2 { margin: 0 0 22px; font-size: 26px; line-height: 44px; font-weight: 800; font-style: italic; color: var(--amber); }
  #help ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; counter-reset: n; }
  #help li {
    position: relative; padding-left: 40px; font-size: 15px; line-height: 1.7; counter-increment: n;
    text-wrap: pretty; word-break: auto-phrase; line-break: strict;
  }
  #help li::before {
    content: counter(n); position: absolute; left: 0; top: 2px; width: 26px; height: 26px; border-radius: 6px;
    background: var(--coral); color: var(--plum); font-size: 14px; font-weight: 800; line-height: 26px; text-align: center;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <button id="rst" data-aria="restart"><svg viewBox="0 0 24 24"><path d="M19.05 14.57A7.5 7.5 0 1 1 15.75 5.5"/><path class="solid" d="M17.35 2.73L18.69 7.2L14.15 8.27Z"/></svg></button>
  <div id="tally"><b id="score">0</b><small><span data-t="best"></span> <span id="best">0</span></small></div>
  <div class="ctl">
  <button id="snd" data-aria="sound"><svg viewBox="0 0 24 24"><path class="solid" d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.3a8 8 0 0 1 0 11.4"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <button id="qbtn" data-aria="help"><svg viewBox="0 0 24 24"><path d="M8.8 9.2a3.3 3.3 0 1 1 4.6 3c-.9.5-1.4 1-1.4 2"/><path d="M12 17.8v.1"/></svg></button>
  </div>
</div>
<div id="hint" data-t="hint"></div>
<div id="over"><h1 data-t="over"></h1><p id="final"></p><p class="tap" data-t="retry"></p></div>
<div id="help">
  <div class="langs"><button data-l="en" lang="en">English</button><button data-l="ja" lang="ja">日本語</button></div>
  <div class="main"><div class="body"><h2 data-t="title"></h2><ul id="hlist"></ul></div></div>
  <button id="hclose" data-aria="close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
</div>

<script>
(() => {
  const KEY = 'ofwg:swift-run';
  // The world is WH units tall and scaled to the viewport height; its width follows the (capped) column width.
  // Terrain is a pure function of the world x coordinate w = dist + screen x, so nothing is stored for it except the spires.
  const WH = 640, COL_MAX = 560, MID = 330;
  const BX = 95, R = 11, HIT = 0.8; // the bird's fixed screen x, body radius and hit-circle share
  // a tap sets the climb speed (not adds to it), so the hop height is the same however fast the taps come
  const GRAVITY = 1600, HOP = 300, FALL_MAX = 600, FLAP_S = 0.22;
  const SPEED_START = 220, SPEED_MAX = 400, SPEED_RAMP = 0.016, BOOST_ADD = 70, BOOST_T = 0.9;
  // centre line = three sines, gently ramped in from the start; slopes stay within what repeated hops can follow
  const A = [38, 12, 55], F = [0.008, 0.018, 0.0035], RAMP_FROM = 0.25, RAMP_LEN = 3000;
  const GAP_START = 250, GAP_MIN = 150, GAP_SHRINK = 0.006, BREATH = 10;
  const SPIRE_FIRST = 1200, SPIRE_GAP = 640, SPIRE_GAP_MIN = 300, SPIRE_SHRINK = 0.02, SPIRE_RAND = 220;
  const PAIR_FROM = 6000, PAIR_P = 0.35; // later, a spire is often followed by one on the opposite wall: a slalom
  const STAGE_LEN = 2500, STAGE_BONUS = 10, COMBO_S = 1.2, COMBO_MAX = 4, POP_MS = 700, BANNER_MS = 1400;
  const GRAZE_D = 11, GRAZE_EVERY = 0.25, SCORE_PER = 40;
  const SPARK_MS = 520, DUSK_LEN = 16000, STEP = 4;
  const SCALE = [0, 2, 4, 7, 9];

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $hud = document.getElementById('hud');
  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $hint = document.getElementById('hint');
  const $over = document.getElementById('over');
  const $final = document.getElementById('final');
  const $snd = document.getElementById('snd');

  const TEXT = {
    en: {
      title: 'How to play',
      hint: 'Tap to flap · hug the cliffs',
      items: [
        'You are a swift racing through a sunset canyon, flying as far as you can between the cliffs.',
        'Tap anywhere, or press Space, and the bird flaps and hops up a little; between taps it falls.',
        'Skimming a cliff wall in a chain earns growing bonus points and speed, while the canyon gets faster and narrower.',
        'The game is over when the bird touches the cliffs.'
      ],
      help: 'Help',
      close: 'Close',
      restart: 'Restart',
      sound: 'Sound',
      best: 'BEST',
      stage: 'STAGE',
      over: 'Crash!',
      retry: 'Tap to retry',
      final: n => (n === 1 ? '1 pt' : `${n} pts`),
    },
    ja: {
      title: '遊び方',
      hint: 'タップで羽ばたく・崖ぎわを飛ぶ',
      items: [
        'アマツバメになって、夕焼けの峡谷の崖の間をどこまで飛べるかに挑戦するゲームです。',
        '画面のどこかをタップ（またはスペースキー）すると羽ばたいて少し跳ね上がり、タップの合間には落ちていきます。',
        '崖すれすれを続けて飛ぶほどボーナス点と加速が増え、進むほど峡谷は速く狭くなります。',
        '崖にぶつかるとゲームオーバーです。'
      ],
      help: 'ヘルプ',
      close: '閉じる',
      restart: 'リスタート',
      sound: 'サウンド',
      best: 'ベスト',
      stage: 'ステージ',
      over: 'ガツン！',
      retry: 'タップでリトライ',
      final: n => `${n}点`,
    },
  };
  const $help = document.getElementById('help');
  const $qbtn = document.getElementById('qbtn');
  const $hclose = document.getElementById('hclose');
  const $hlist = document.getElementById('hlist');
  const $langBar = document.querySelector('.langs');
  const $langs = $langBar.querySelectorAll('button');

  let tx;
  const setLang = l => {
    tx = TEXT[l];
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = tx[e.dataset.t]; });
    document.querySelectorAll('[data-aria]').forEach(e => e.setAttribute('aria-label', tx[e.dataset.aria]));
    $hlist.replaceChildren(...tx.items.map(t => Object.assign(document.createElement('li'), { textContent: t })));
    $langs.forEach(b => b.classList.toggle('on', b.dataset.l === l));
    if (over) renderOver();
    if (helpOpen) placeHelp(); // the HUD labels changed, so the ? may have moved
  };
  // the ? sits in the HUD row, whose position is only known at runtime: the close button copies its box,
  // the language switch is level with it, and the centred column's left edge mirrors its right edge
  const placeHelp = () => {
    const r = $qbtn.getBoundingClientRect(), barH = $langBar.offsetHeight, w = document.documentElement.clientWidth;
    Object.assign($hclose.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    $help.style.paddingTop = r.top + (r.height - barH) / 2 + 'px';
    $help.style.paddingInline = w - r.right + 'px';
  };
  let helpOpen = false;
  // inert keeps Tab and Enter from reaching the controls behind the panel
  const showHelp = open => {
    helpOpen = open;
    $help.classList.toggle('show', open);
    for (const el of [$hud, $over]) el.inert = open;
    if (open) { placeHelp(); $hclose.focus(); }
  };

  let bird, spires, sparks, pops, banner, stage, combo, lastGraze, clock, started, over, overTimer, bonus, shown, dist, boost, grazeAcc, hops, nextSpire, shake, ph;
  let W = 0, H = 0, dpr = 1, s = 1, colX = 0, colW = 0, LW = 0, best = 0;

  try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) { /* storage unavailable */ }

  // muting silences a master gain, so tones already scheduled go quiet too
  let ac = null, master = null, muted = false;
  const audio = () => {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      master = ac.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  // a touch pointerdown is no user activation, so a tone only plays once the context already runs
  const tone = (freq, delay, dur, type, vol) => {
    if (!ac || ac.state !== 'running') return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  };
  // successive flaps walk up and down a pentatonic scale, so quick tapping plays a little tune
  const playHop = n => {
    const k = n % 10, i = k < 5 ? k : 9 - k;
    tone(392 * 2 ** (SCALE[i] / 12), 0, 0.09, 'triangle', 0.09);
  };
  const playGraze = n => tone(1175 * 2 ** (SCALE[n - 1] / 12), 0, 0.07, 'square', 0.04);
  const playStage = () => [0, 4, 7, 12].forEach((st, i) => tone(523 * 2 ** (st / 12), i * 0.06, 0.18, 'triangle', 0.1));
  const playOver = () => [5, 1, -4].forEach((st, i) => tone(330 * 2 ** (st / 12), i * 0.1, 0.3, 'sawtooth', 0.08));

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // terrain: centre line, gap, and the spires that bite into one wall
  const cy = w => MID + clamp(RAMP_FROM + w / RAMP_LEN, 0, 1) * (A[0] * Math.sin(w * F[0] + ph[0]) + A[1] * Math.sin(w * F[1] + ph[1]) + A[2] * Math.sin(w * F[2] + ph[2]));
  const gapAt = w => Math.max(GAP_MIN, GAP_START - w * GAP_SHRINK + BREATH * Math.sin(w * 0.013 + ph[3]));
  const spireAt = (w, side) => {
    let m = 0;
    for (const b of spires) {
      if (b.side !== side) continue;
      const k = 1 - Math.abs(w - b.x) / b.w;
      if (k > 0 && b.h * k > m) m = b.h * k;
    }
    return m;
  };
  const ceilAt = w => cy(w) - gapAt(w) / 2 + spireAt(w, 0);
  const floorAt = w => cy(w) + gapAt(w) / 2 - spireAt(w, 1);

  const fillSpires = () => {
    const mk = (x, side) => ({ x, side, w: rnd(28, 42), h: gapAt(x) * rnd(0.2, 0.3) });
    while (nextSpire < dist + LW + 200) {
      const side = Math.random() < 0.5 ? 0 : 1;
      let end = nextSpire;
      spires.push(mk(end, side));
      if (end > PAIR_FROM && Math.random() < PAIR_P) { end += rnd(120, 170); spires.push(mk(end, 1 - side)); }
      nextSpire = end + Math.max(SPIRE_GAP_MIN, SPIRE_GAP - dist * SPIRE_SHRINK) + rnd(0, SPIRE_RAND);
    }
    while (spires.length && spires[0].x + spires[0].w < dist - 60) spires.shift();
  };

  const streaks = Array.from({ length: 16 }, () => ({ x: Math.random(), y: rnd(20, WH - 20), k: rnd(1.3, 2.2), a: rnd(0.4, 1) }));
  const clouds = Array.from({ length: 6 }, (_, i) => ({ x: i / 6, y: rnd(60, 330), w: rnd(90, 190), k: rnd(0.15, 0.4) }));
  const ridges = [
    { k: 0.1, base: 440, a: [34, 14], f: [0.011, 0.027], p: [1.2, 4.1], col: '#b0689d' },
    { k: 0.25, base: 500, a: [30, 12], f: [0.016, 0.037], p: [2.7, 0.4], col: '#8a4a8c' },
  ];

  const newGame = () => {
    ph = [rnd(0, 6.3), rnd(0, 6.3), rnd(0, 6.3), rnd(0, 6.3)];
    spires = []; sparks = []; pops = []; banner = null; stage = 0; combo = 0; lastGraze = -1e9; clock = 0;
    started = false; over = false;
    bonus = 0; dist = 0; boost = 0; grazeAcc = 0; hops = 0; shake = 0; nextSpire = SPIRE_FIRST;
    bird = { y: cy(BX), vy: 0, flap: 0 };
    clearTimeout(overTimer);
    $over.classList.remove('show');
    $hint.hidden = false;
    fillSpires();
    shown = -1; // forces the next renderHud to redraw
    renderHud();
  };

  const scoreNow = () => Math.floor(dist / SCORE_PER) + bonus;
  // written on death and when the page is hidden, not on every point of a record run
  const saveBest = () => { try { localStorage.setItem(KEY, String(best)); } catch (e) { /* storage unavailable */ } };
  const renderHud = () => {
    const n = scoreNow();
    if (n === shown) return;
    shown = n;
    if (n > best) best = n;
    $score.textContent = n; $best.textContent = best;
  };
  const renderOver = () => { $final.textContent = tx.final(scoreNow()); };

  const die = t => {
    over = true; shake = 1;
    for (let i = 0; i < 14; i++) {
      sparks.push({ x: BX + rnd(-8, 8), y: bird.y + rnd(-8, 8), vx: rnd(-160, 40), vy: rnd(-140, 80), r: rnd(1.5, 3.5), t, c: i % 3 ? '#2d2250' : '#f6e6cf' });
    }
    renderHud(); // the death frame may have crossed a score step
    saveBest();
    playOver();
    renderOver();
    overTimer = setTimeout(() => $over.classList.add('show'), 700);
  };

  const speedNow = () => Math.min(SPEED_MAX, SPEED_START + dist * SPEED_RAMP) + BOOST_ADD * boost;

  const step = (dt, t) => {
    const speed = speedNow();
    boost = Math.max(0, boost - dt / BOOST_T);
    bird.vy = Math.min(FALL_MAX, bird.vy + GRAVITY * dt);
    bird.y += bird.vy * dt;
    bird.flap = Math.max(0, bird.flap - dt / FLAP_S);
    dist += speed * dt; clock += dt;
    fillSpires();
    if (Math.floor(dist / STAGE_LEN) > stage) {
      stage++; bonus += STAGE_BONUS; boost = 1;
      banner = t; // start time; a stage is far longer than the banner, so stage + 1 is still its number
      playStage();
    }

    // samples across the hit circle, close enough together that a spire's tip cannot hide between them
    const hr = R * HIT;
    let clear = Infinity;
    for (const f of [-1, -0.5, 0, 0.5, 1]) {
      const dx = f * hr, w = dist + BX + dx, h = Math.sqrt(Math.max(0, hr * hr - dx * dx)); // the circle's half-height at this offset
      clear = Math.min(clear, bird.y - ceilAt(w) - h, floorAt(w) - bird.y - h);
    }
    if (clear < 0) return die(t);
    if (clear < GRAZE_D) {
      grazeAcc += dt;
      if (grazeAcc >= GRAZE_EVERY) {
        grazeAcc = 0; boost = 1;
        combo = clock - lastGraze < COMBO_S ? Math.min(combo + 1, COMBO_MAX) : 1;
        lastGraze = clock; bonus += combo; playGraze(combo);
        pops.push({ t, n: combo });
        for (let i = 0; i < 4; i++) sparks.push({ x: BX + rnd(-6, 6), y: bird.y + rnd(-6, 6), vx: -speed * rnd(0.5, 1), vy: rnd(-50, 50), r: rnd(1.2, 2.6), t, c: '#ffd98a' });
      }
    } else grazeAcc = 0;
    renderHud();
  };

  const hop = () => {
    if (helpOpen || over) return;
    if (!started) { started = true; $hint.hidden = true; }
    bird.vy = -HOP; bird.flap = 1;
    playHop(hops++);
  };

  cv.addEventListener('pointerdown', e => { e.preventDefault(); hop(); });
  cv.addEventListener('pointerup', () => audio()); // touch pointerup counts as a user activation, unlike pointerdown
  ['gesturestart', 'contextmenu', 'dblclick'].forEach(n => window.addEventListener(n, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveBest(); });
  window.addEventListener('pagehide', saveBest);
  window.addEventListener('keydown', e => {
    if (helpOpen) { if (e.key === 'Escape') showHelp(false); return; }
    if (e.key !== ' ' && e.key !== 'ArrowUp' && e.key !== 'w') return;
    e.preventDefault();
    if (e.repeat) return;
    audio();
    if (over && $over.classList.contains('show')) newGame(); // the keyboard retry, like a tap on the overlay
    else hop();
  });

  // a button that keeps focus would also react to Space, the flap key
  document.querySelectorAll('#hud button').forEach(b => b.addEventListener('click', () => b.blur()));
  $qbtn.addEventListener('click', () => showHelp(true));
  $hclose.addEventListener('click', () => showHelp(false));
  $langs.forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));
  setLang(navigator.language.startsWith('ja') ? 'ja' : 'en');

  $over.addEventListener('click', newGame);
  document.getElementById('rst').addEventListener('click', newGame);
  $snd.addEventListener('click', () => {
    muted = !muted;
    $snd.classList.toggle('off', muted);
    if (master) master.gain.value = muted ? 0 : 1;
    audio();
  });

  const layout = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    s = H / WH;
    colW = Math.min(W, COL_MAX);
    colX = (W - colW) / 2;
    LW = colW / s;
    if (spires) fillSpires();
  };
  window.addEventListener('resize', () => { layout(); if (helpOpen) placeHelp(); });

  const disc = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };

  // static scenery, built once: the world is WH tall at any viewport, so the gradient never changes
  const sky = ctx.createLinearGradient(0, 0, 0, WH);
  sky.addColorStop(0, '#7b5ea7');
  sky.addColorStop(0.45, '#f07f7c');
  sky.addColorStop(0.8, '#ffbe85');
  sky.addColorStop(1, '#ffe0a3');
  const glow = ctx.createRadialGradient(0, 0, 8, 0, 0, 150);
  glow.addColorStop(0, 'rgba(255,240,196,.9)');
  glow.addColorStop(1, 'rgba(255,240,196,0)');

  const drawBird = (y, vy, flap, t) => {
    const tip = 3 - 20 * flap + (started ? 0 : Math.sin(t / 130) * 3);
    ctx.save();
    ctx.translate(BX, y);
    ctx.rotate(over ? 1.2 : clamp(vy / 900, -0.45, 0.6));
    ctx.fillStyle = '#2d2250';
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-20, -5.5); ctx.lineTo(-15, 0); ctx.lineTo(-20, 5.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1d1538'; // far wing
    ctx.beginPath(); ctx.moveTo(4, -2); ctx.quadraticCurveTo(-8, tip - 9, -25, tip - 3); ctx.quadraticCurveTo(-10, tip * 0.3, -5, 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2d2250';
    ctx.beginPath(); ctx.ellipse(0, 0, 12.5, 6.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f6e6cf';
    ctx.beginPath(); ctx.ellipse(3, 2.6, 8, 3.4, 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d2f70'; // near wing
    ctx.beginPath(); ctx.moveTo(5, -1); ctx.quadraticCurveTo(-7, tip - 7, -27, tip); ctx.quadraticCurveTo(-10, tip * 0.3 + 3, -5, 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffc46b';
    ctx.beginPath(); ctx.moveTo(11, -1); ctx.lineTo(15, 0.5); ctx.lineTo(11, 2); ctx.closePath(); ctx.fill();
    if (over) {
      ctx.strokeStyle = '#fff3dc'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(4.5, -3.8); ctx.lineTo(7.5, -0.8); ctx.moveTo(7.5, -3.8); ctx.lineTo(4.5, -0.8); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff3dc'; disc(6.2, -1.9, 1.9);
      ctx.fillStyle = '#1d1538'; disc(6.8, -1.9, 1);
    }
    ctx.restore();
  };

  const render = t => {
    const speed = speedNow();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#2d1b3d';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(colX + (shake && (Math.random() - 0.5) * 8 * shake), shake && (Math.random() - 0.5) * 8 * shake);
    ctx.scale(s, s);
    ctx.beginPath(); ctx.rect(0, 0, LW, WH); ctx.clip();
    ctx.fillStyle = sky; ctx.fillRect(0, 0, LW, WH);

    ctx.save();
    ctx.translate(LW * 0.68, 400);
    ctx.fillStyle = glow; ctx.fillRect(-160, -160, 320, 320);
    ctx.fillStyle = '#fff0c4'; disc(0, 0, 46);
    ctx.restore();

    ctx.fillStyle = 'rgba(255,236,214,.28)';
    clouds.forEach(c => {
      const span = LW + c.w * 2, x = (((c.x * span - (dist + t / 40) * c.k) % span) + span) % span - c.w;
      ctx.beginPath(); ctx.roundRect(x, c.y, c.w, 9, 4.5); ctx.fill();
    });
    ridges.forEach(r => {
      ctx.fillStyle = r.col;
      ctx.beginPath(); ctx.moveTo(0, WH);
      for (let x = 0; x <= LW + 12; x += 12) {
        const u = x + dist * r.k;
        ctx.lineTo(x, r.base - r.a[0] * Math.abs(Math.sin(u * r.f[0] + r.p[0])) - r.a[1] * Math.sin(u * r.f[1] + r.p[1]));
      }
      ctx.lineTo(LW + 12, WH); ctx.fill();
    });
    ctx.globalAlpha = 0.42 * clamp(dist / DUSK_LEN, 0, 1);
    ctx.fillStyle = '#2b1a4a'; ctx.fillRect(0, 0, LW, WH);
    ctx.globalAlpha = 1;

    const edgeTop = new Path2D(), edgeBot = new Path2D();
    // samples sit on a fixed world grid, so a spire's drawn tip does not change height as it scrolls
    const x0 = -(dist % STEP);
    for (let x = x0; x <= LW + STEP; x += STEP) {
      const w = dist + x;
      if (x > x0) { edgeTop.lineTo(x, ceilAt(w)); edgeBot.lineTo(x, floorAt(w)); } else { edgeTop.moveTo(x, ceilAt(w)); edgeBot.moveTo(x, floorAt(w)); }
    }
    // the edges stay open lines for stroking; the filled copies close around the screen corners
    const top = new Path2D(edgeTop), bot = new Path2D(edgeBot);
    top.lineTo(LW + STEP, -20); top.lineTo(x0, -20); top.closePath();
    bot.lineTo(LW + STEP, WH + 20); bot.lineTo(x0, WH + 20); bot.closePath();
    ctx.fillStyle = '#b9482b'; ctx.fill(top); ctx.fill(bot);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(70,16,28,.2)'; ctx.lineJoin = 'round';
    for (let i = 1; i <= 4; i++) {
      ctx.save(); ctx.translate(0, i * 34 - 8); ctx.stroke(edgeBot);
      ctx.translate(0, -i * 68 + 16); ctx.stroke(edgeTop);
      ctx.restore();
    }
    ctx.lineWidth = 5; ctx.strokeStyle = '#7e2f21'; ctx.stroke(edgeTop); ctx.stroke(edgeBot);
    ctx.save(); ctx.translate(0, -3); ctx.lineWidth = 3; ctx.strokeStyle = '#f19a68'; ctx.stroke(edgeBot); ctx.restore();
    ctx.save(); ctx.translate(0, 3); ctx.stroke(edgeTop); ctx.restore();

    // wind streaks fly past faster than the cliffs; they lengthen and brighten with speed
    ctx.lineCap = 'round'; ctx.lineWidth = 2.5;
    const sp = clamp((speed - 200) / 200, 0.1, 1), span = LW + 240;
    streaks.forEach(k => {
      const x = (((k.x * span - dist * k.k) % span) + span) % span - 120;
      ctx.strokeStyle = `rgba(255,243,220,${0.85 * k.a * sp})`;
      ctx.beginPath(); ctx.moveTo(x, k.y); ctx.lineTo(x + 20 + speed * 0.3 * k.k, k.y); ctx.stroke();
    });

    sparks.forEach(p => {
      ctx.globalAlpha = 1 - (t - p.t) / SPARK_MS;
      ctx.fillStyle = p.c; disc(p.x, p.y, p.r);
    });
    ctx.globalAlpha = 1;

    const by = started ? bird.y : bird.y + Math.sin(t / 380) * 6;
    drawBird(by, bird.vy, bird.flap, t);
    ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#2d1b3d';
    pops.forEach(o => {
      const age = (t - o.t) / POP_MS;
      ctx.globalAlpha = 1 - age; ctx.lineWidth = 4;
      ctx.font = `italic 800 ${14 + o.n * 3}px "Avenir Next", "Hiragino Kaku Gothic ProN", system-ui, sans-serif`;
      const text = '+' + o.n;
      ctx.strokeText(text, BX, by - 24 - age * 26); ctx.fillStyle = '#ffd98a'; ctx.fillText(text, BX, by - 24 - age * 26);
    });
    if (banner !== null) {
      const age = (t - banner) / BANNER_MS, text = `${tx.stage} ${stage + 1}`;
      ctx.globalAlpha = age < 0.15 ? age / 0.15 : 1 - (age - 0.15) / 0.85;
      ctx.font = 'italic 800 44px "Avenir Next", "Hiragino Kaku Gothic ProN", system-ui, sans-serif';
      ctx.lineWidth = 8; ctx.strokeText(text, LW / 2, WH * 0.3);
      ctx.fillStyle = '#fff3dc'; ctx.fillText(text, LW / 2, WH * 0.3);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  };

  let last = 0;
  const frame = t => {
    requestAnimationFrame(frame); // first, so one throwing frame cannot end the loop
    const dt = Math.min((t - last) / 1000, 1 / 30);
    last = t;
    if (started && !over && !helpOpen) step(dt, t);
    if (over) { bird.vy = Math.min(FALL_MAX, bird.vy + GRAVITY * dt); bird.y += bird.vy * dt * 0.4; }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (t - p.t > SPARK_MS) sparks.splice(i, 1);
    }
    for (let i = pops.length - 1; i >= 0; i--) if (t - pops[i].t > POP_MS) pops.splice(i, 1);
    if (banner !== null && t - banner > BANNER_MS) banner = null;
    shake = Math.max(0, shake - dt / 0.4);
    if (!helpOpen) render(t); // the help panel is opaque, so nothing behind it needs drawing
  };

  layout();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
