<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 5H23C27.5 5 30 7.5 31 12L31.5 21C31.8 25 30 27.5 27 27.5C24.5 27.5 23.5 26 22.5 24L21.5 22H10.5L9.5 24C8.5 26 7.5 27.5 5 27.5C2 27.5 0.2 25 0.5 21L1 12C2 7.5 4.5 5 9 5Z' fill='%23ff6b4a'/%3E%3Cpath d='M9 10.5v7M5.5 14h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='15.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='26' cy='12' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; --bg: #f2f2f7; --ink: #1d1d1f; --mute: #86868b; --card: #fff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background:
      radial-gradient(70% 50% at 0% 0%, #d3c5f5, transparent),
      radial-gradient(50% 35% at 100% 8%, #fbe0cf, transparent),
      radial-gradient(70% 50% at 50% 100%, #c2dff5, transparent),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 1040px; margin: 0 auto; }
  h1, p { font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif; }
  h1 { margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  p { margin: 0 0 24px; color: var(--mute); font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  a {
    display: block; height: 100%; overflow: hidden; background: var(--card); color: inherit;
    text-decoration: none; border-radius: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    transition: transform .12s;
  }
  a:active { transform: scale(.97); }
  svg { display: block; width: 100%; aspect-ratio: 4 / 3; }
  .info { padding: 12px 14px 14px; }
  strong {
    display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: 17px; line-height: 1.25; font-weight: 600; letter-spacing: -.01em;
  }
  .tag {
    display: table; margin-top: 6px; padding: 2px 8px; border-radius: 99px;
    font-style: normal; font-size: 10px; font-weight: 600; letter-spacing: .04em;
  }
  .tag.puzzle { background: #ece7ff; color: #6a4fc4; }
  .tag.arcade { background: #ffe9dc; color: #c4561f; }
</style>
</head>
<body>
<main>
  <h1>Web Games</h1>
  <p>Mini games, one tap away.</p>

          <rect x="24" y="47" width="34" height="34" rx="3" fill="#b8b8b3"/><text x="41" y="69">8</text>
          <rect x="62" y="47" width="34" height="34" rx="3" fill="#222221"/><text x="79" y="69" fill="#f2f2f0">16</text>
        </g>

      <i class="tag puzzle">Puzzle</i></div>
    </a></li>

        <circle cx="20" cy="14" r="30" fill="#9660ff" opacity=".18"/><circle cx="110" cy="80" r="26" fill="#28c8ff" opacity=".14"/>

        <path d="M14 70L106 22" stroke="#bfe3ff" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>

          <path d="M80 22L90.4 28V40L80 46L69.6 40V28Z" fill="#b6ff5c" stroke="#b6ff5c"/>

</main>
</body>
</html>
