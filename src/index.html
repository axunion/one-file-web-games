<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Games</title>
<style>
  :root { color-scheme: light; --bg: #f2f2f7; --ink: #1d1d1f; --mute: #86868b; --card: #fff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  p { margin: 0 0 24px; color: var(--mute); font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a {
    display: block; padding: 16px 18px; background: var(--card); color: inherit;
    text-decoration: none; border-radius: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  a:active { transform: scale(.98); }
  strong { display: block; font-size: 18px; font-weight: 500; }
  span { font-size: 13px; color: var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Web Games</h1>
  <p>Mini games, one tap away.</p>
  <ul>
    <li><a href="classic-2048/"><strong>2048</strong><span>The classic sliding-tile puzzle</span></a></li>
    <li><a href="jelly-melody/"><strong>Jelly Melody</strong><span>2048 with chain merges and pentatonic sounds</span></a></li>
  </ul>
</main>
</body>
</html>
