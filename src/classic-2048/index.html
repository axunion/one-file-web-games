<!DOCTYPE html>
<!-- SHOULD deviation: short rounds - faithful classic 2048 plays until the board locks up, often well past a few minutes -->
<!-- SHOULD deviation: original identity - an intentionally plain greyscale baseline with no world of its own, kept for comparison with Jelly Melody -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>2048</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 5H23C27.5 5 30 7.5 31 12L31.5 21C31.8 25 30 27.5 27 27.5C24.5 27.5 23.5 26 22.5 24L21.5 22H10.5L9.5 24C8.5 26 7.5 27.5 5 27.5C2 27.5 0.2 25 0.5 21L1 12C2 7.5 4.5 5 9 5Z' fill='%23ff6b4a'/%3E%3Cpath d='M9 10.5v7M5.5 14h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='15.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='26' cy='12' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --bg: #f2f2f0; --ink: #222221; --mute: #8a8a85; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; display: flex; align-items: flex-end; justify-content: space-between; }
  h1 { margin: 0; font-size: clamp(34px, 11vw, 46px); line-height: 1; font-weight: 300; letter-spacing: .02em; }
  .stats { display: flex; gap: 22px; text-align: right; }
  .stats small { display: block; font-size: 10px; letter-spacing: .16em; color: var(--mute); }
  .stats b { font-size: 22px; line-height: 1.3; font-weight: 500; font-variant-numeric: tabular-nums; }
  button {
    border: 1px solid var(--ink); border-radius: 4px; background: transparent; color: var(--ink);
    padding: 11px 24px; font: inherit; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
  }
  button:active { background: var(--ink); color: var(--bg); }
  #rst { position: fixed; left: 50%; transform: translateX(-50%); }
  #over {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: rgba(242, 242, 240, .88); cursor: pointer;
  }
  #over.show { display: flex; }
  #over h2 { margin: 0; font-size: 40px; font-weight: 300; letter-spacing: .02em; }
  #over p { margin: 0; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  .ibtn {
    position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: calc(env(safe-area-inset-right) + 12px);
    width: 32px; height: 32px; padding: 0; border-radius: 50%; display: grid; place-items: center;
    border-color: var(--mute); color: var(--mute);
  }
  .ibtn svg { pointer-events: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  #help {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 28px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 28px);
  }
  #help.show { display: flex; }
  #help .langs { display: grid; grid-template-columns: 1fr 1fr; width: 144px; align-self: flex-start; gap: 8px; height: 32px; }
  #help .langs button { padding: 0; }
  #help .langs button.on { background: var(--ink); color: var(--bg); }
  /* the body sits in a fixed-height box centred vertically, text top-aligned inside, so switching language moves nothing */
  #help .main { width: min(100%, 340px); flex: 1; display: flex; align-items: center; padding-bottom: 40px; }
  #help .body { width: 100%; height: 400px; }
  #help h2 { margin: 0 0 20px; font-size: 28px; line-height: 44px; font-weight: 300; letter-spacing: .02em; }
  #help ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 20px; }
  #help li { font-size: 16px; line-height: 1.7; text-wrap: pretty; word-break: auto-phrase; line-break: strict; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <h1>2048</h1>
  <div class="stats">
    <div><small>SCORE</small><b id="score">0</b></div>
    <div><small>BEST</small><b id="best">0</b></div>
  </div>
</div>
<button id="rst">New game</button>
<div id="over"><h2>Game over</h2><p id="final"></p><button>Try again</button></div>
<button id="qbtn" class="ibtn"><svg viewBox="0 0 24 24"><path d="M8.8 9.2a3.3 3.3 0 1 1 4.6 3c-.9.5-1.4 1-1.4 2"/><path d="M12 17.8v.1"/></svg></button>
<div id="help">
  <div class="langs"><button data-l="en"></button><button data-l="ja"></button></div>
  <div class="main"><div class="body"><h2 id="htitle"></h2><ul id="hlist"></ul></div></div>
  <button id="hclose" class="ibtn"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
</div>

<script>
(() => {
  const N = 4;
  const KEY = 'ofwg:classic-2048';
  const MOVE_MS = 110, SPAWN_MS = 200, POP_MS = 150;
  const FONT_SCALE = { 1: 0.5, 2: 0.5, 3: 0.42, 4: 0.34 };
  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  const FONT = '"Helvetica Neue", Helvetica, Arial, system-ui, sans-serif';
  // greyscale from white to black; the darker the tile, the higher the value
  const COLORS = { 2: '#ffffff', 4: '#c4c4bf', 8: '#a3a39e', 16: '#82827d', 32: '#63635f', 64: '#484845',
                   128: '#343432', 256: '#242423', 512: '#181817', 1024: '#0e0e0d', 2048: '#000000' };

  const HELP = {
    en: {
      title: 'How to play', labels: ['EN', 'JA'], aria: { help: 'Help', close: 'Close' },
      items: ['The goal is to merge numbered tiles into a 2048 tile.', 'Swipe, or use the arrow keys, and every tile slides that way.', 'When two tiles with the same number touch, they merge into one with double the value.', 'The game is over when the board is full and no move is left.'],
    },
    ja: {
      title: '遊び方', labels: ['英語', '日本語'], aria: { help: 'ヘルプ', close: '閉じる' },
      items: ['数字のタイルを合体させて、2048を目指すゲームです。', 'スワイプ（または矢印キー）すると、すべてのタイルがその向きに滑ります。', '同じ数字のタイルがぶつかると、合体して数字が2倍になります。', '盤面が埋まって動かせなくなると、ゲームオーバーです。'],
    },
  };

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $hud = document.getElementById('hud');
  const $rst = document.getElementById('rst');
  const $over = document.getElementById('over');
  const $final = document.getElementById('final');
  const $help = document.getElementById('help');
  const $htitle = document.getElementById('htitle');
  const $hlist = document.getElementById('hlist');
  const $langs = document.querySelectorAll('.langs button');
  const $qbtn = document.getElementById('qbtn');
  const $hclose = document.getElementById('hclose');

  const setLang = l => {
    $help.lang = $qbtn.lang = l;
    const h = HELP[l];
    $htitle.textContent = h.title;
    $hlist.replaceChildren(...h.items.map(t => Object.assign(document.createElement('li'), { textContent: t })));
    $qbtn.setAttribute('aria-label', h.aria.help);
    $hclose.setAttribute('aria-label', h.aria.close);
    $langs.forEach((b, i) => { b.textContent = h.labels[i]; b.classList.toggle('on', b.dataset.l === l); });
  };
  // inert keeps Tab and Enter from reaching the controls behind the panel
  let helpOpen = false;
  const showHelp = open => {
    helpOpen = open;
    $help.classList.toggle('show', open);
    for (const el of [$rst, $over, $qbtn]) el.inert = open;
    if (open) $hclose.focus();
  };

  let grid, tiles, score, best = 0, over, overTimer, stage, pending, dirty = true;
  let W = 0, H = 0, dpr = 1, bx = 0, by = 0, bs = 0, gap = 0, cell = 0;

  try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) { /* storage unavailable */ }

  const now = () => performance.now();

  const newGame = () => {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    tiles = [];
    score = 0; over = false; stage = null; pending = null;
    clearTimeout(overTimer);
    $over.classList.remove('show');
    spawn(); spawn();
    renderHud();
    dirty = true;
  };

  const renderHud = () => { $score.textContent = score; $best.textContent = best; };

  const spawn = () => {
    const empty = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const t = { v: Math.random() < 0.9 ? 2 : 4, r, c, x: c, y: r, fx: c, fy: r, spawnT: now(), popT: -Infinity };
    grid[r][c] = t; tiles.push(t);
  };

  const lineCell = (dir, i, k) => {
    if (dir === 'left') return [i, k];
    if (dir === 'right') return [i, N - 1 - k];
    if (dir === 'up') return [k, i];
    return [N - 1 - k, i];
  };

  const slide = dir => {
    const merges = [];
    let moved = false;
    const next = Array.from({ length: N }, () => Array(N).fill(null));
    for (let i = 0; i < N; i++) {
      let pos = 0, last = null;
      for (let k = 0; k < N; k++) {
        const [r, c] = lineCell(dir, i, k);
        const t = grid[r][c];
        if (!t) continue;
        if (last && last.v === t.v) {
          merges.push({ keep: last, gone: t });
          t.r = last.r; t.c = last.c;
          moved = true;
          last = null;
        } else {
          const [nr, nc] = lineCell(dir, i, pos++);
          if (nr !== t.r || nc !== t.c) moved = true;
          t.r = nr; t.c = nc;
          next[nr][nc] = t;
          last = t;
        }
      }
    }
    if (!moved) return null;
    grid = next;
    for (const t of tiles) { t.fx = t.x; t.fy = t.y; }
    return merges;
  };

  const tryMove = dir => {
    if (over) return;
    if (stage) { pending = dir; return; }
    const merges = slide(dir);
    if (!merges) return;
    const t0 = now();
    stage = { t0, until: t0 + MOVE_MS, merges };
  };

  const settle = merges => {
    for (const t of tiles) { t.x = t.c; t.y = t.r; }
    for (const m of merges) {
      tiles.splice(tiles.indexOf(m.gone), 1);
      const k = m.keep;
      k.v *= 2; k.popT = now();
      score += k.v;
    }
    if (score > best) {
      best = score;
      try { localStorage.setItem(KEY, String(best)); } catch (e) { /* storage unavailable */ }
    }
    renderHud();
    spawn();
    if (!canMove()) { gameOver(); return; }
    if (pending) { const d = pending; pending = null; tryMove(d); }
  };

  const canMove = () => {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (!t) return true;
      if (c + 1 < N && grid[r][c + 1]?.v === t.v) return true;
      if (r + 1 < N && grid[r + 1][c]?.v === t.v) return true;
    }
    return false;
  };

  const gameOver = () => {
    over = true;
    overTimer = setTimeout(() => {
      $final.textContent = 'Score ' + score;
      $over.classList.add('show');
    }, 450);
  };

  const rr = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    dirty = true;
    bs = Math.min(W * 0.92, H * 0.55, 500);
    bx = (W - bs) / 2;
    by = Math.max((H - bs) / 2, 110);
    gap = bs * 0.03; cell = (bs - gap * (N + 1)) / N;
    // header sits on the board's edges, the button centred below it
    $hud.style.left = bx + 'px'; $hud.style.width = bs + 'px'; $hud.style.bottom = (H - by + 20) + 'px';
    $rst.style.top = (by + bs + 24) + 'px';
  };

  const update = ts => {
    if (!stage) return;
    const p = Math.max(0, Math.min(1, (ts - stage.t0) / MOVE_MS));
    for (const t of tiles) {
      t.x = t.fx + (t.c - t.fx) * p;
      t.y = t.fy + (t.r - t.fy) * p;
    }
    if (ts >= stage.until) { const m = stage.merges; stage = null; settle(m); }
  };

  const drawTile = (t, ts) => {
    let k = Math.min(1, Math.max(0, (ts - t.spawnT) / SPAWN_MS));
    const s = (ts - t.popT) / POP_MS;
    if (s >= 0 && s < 1) k = 1 + 0.12 * Math.sin(Math.PI * s);
    const size = cell * k;
    const cx = bx + gap + t.x * (cell + gap) + cell / 2, cy = by + gap + t.y * (cell + gap) + cell / 2;
    ctx.fillStyle = COLORS[t.v] ?? COLORS[2048];
    rr(cx - size / 2, cy - size / 2, size, size, size * 0.06); ctx.fill();
    const val = String(t.v);
    ctx.fillStyle = t.v <= 8 ? '#2b2b2a' : '#f5f5f3';
    ctx.font = `600 ${cell * (FONT_SCALE[val.length] ?? 0.27) * k}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(val, cx, cy + cell * 0.03);
  };

  const draw = ts => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#d6d6d1';
    rr(bx, by, bs, bs, bs * 0.015); ctx.fill();
    ctx.fillStyle = '#e3e3df';
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      rr(bx + gap + c * (cell + gap), by + gap + r * (cell + gap), cell, cell, cell * 0.06);
      ctx.fill();
    }
    for (const t of tiles) drawTile(t, ts);
  };

  // redraw only while something moves, plus the first frame after it stops so the final state lands
  const animating = ts => stage || tiles.some(t => ts - t.spawnT < SPAWN_MS || ts - t.popT < POP_MS);
  let wasAnimating = false;
  const frame = ts => {
    update(ts);
    const busy = !!animating(ts);
    if (dirty || busy || wasAnimating) { dirty = false; draw(ts); }
    wasAnimating = busy;
    requestAnimationFrame(frame);
  };

  let start = null;
  const THRESH = 24;
  window.addEventListener('pointerdown', e => {
    if (start || over || helpOpen || e.target.closest('button')) return;
    start = { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointermove', e => {
    if (!start || e.pointerId !== start.id) return;
    if (e.pointerType === 'mouse' && !e.buttons) { start = null; return; }
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < THRESH) return;
    start = null;
    tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  const endGesture = e => { if (start && e.pointerId === start.id) start = null; };
  window.addEventListener('pointerup', endGesture);
  window.addEventListener('pointercancel', endGesture);
  window.addEventListener('keydown', e => {
    if (helpOpen) { if (e.key === 'Escape') showHelp(false); return; }
    const d = KEYS[e.key];
    if (d) { e.preventDefault(); tryMove(d); }
  });
  ['gesturestart', 'contextmenu', 'dblclick'].forEach(n => window.addEventListener(n, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  $over.addEventListener('click', newGame);
  $rst.addEventListener('click', () => { $rst.blur(); newGame(); });

  $qbtn.addEventListener('click', () => showHelp(true));
  $hclose.addEventListener('click', () => showHelp(false));
  $langs.forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));

  window.addEventListener('resize', resize);
  setLang(navigator.language.startsWith('ja') ? 'ja' : 'en');
  resize();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
