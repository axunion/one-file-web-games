<!DOCTYPE html>
<!-- World: night-festival stall - lantern oranges and vivid snack colors on indigo -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dango Skewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 5H23C27.5 5 30 7.5 31 12L31.5 21C31.8 25 30 27.5 27 27.5C24.5 27.5 23.5 26 22.5 24L21.5 22H10.5L9.5 24C8.5 26 7.5 27.5 5 27.5C2 27.5 0.2 25 0.5 21L1 12C2 7.5 4.5 5 9 5Z' fill='%23ff6b4a'/%3E%3Cpath d='M9 10.5v7M5.5 14h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='15.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='26' cy='12' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --night: #1c2142; --paper: #f3e6cf; --lantern: #ff9a3c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--paper);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; z-index: 1; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);
    max-width: 560px; margin: 0 auto;
  }
  #tally { text-align: center; }
  #tally b {
    display: block; font-size: 40px; line-height: 1; font-weight: 700;
    text-shadow: 0 0 14px rgba(255, 154, 60, .55);
  }
  #tally small { font-size: 12px; letter-spacing: .24em; color: var(--lantern); }
  button {
    width: 42px; height: 42px; border: 1.5px solid rgba(255, 154, 60, .6); border-radius: 50%;
    background: transparent; color: var(--lantern); padding: 0; display: grid; place-items: center; cursor: pointer;
  }
  button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  button svg .solid { fill: currentColor; stroke-width: 1.2; }
  .x { display: none; }
  #snd.off .x { display: inline; }
  #snd.off .wave { display: none; }
  button:active { background: rgba(255, 154, 60, .2); }
  #snd.off { opacity: .35; }
  #hint {
    position: fixed; left: 50%; top: 38%; transform: translateX(-50%); width: max-content; max-width: 88vw;
    padding: 8px 18px; border-radius: 4px; background: var(--paper); color: var(--night);
    text-align: center; font-size: 16px; letter-spacing: .05em; pointer-events: none;
  }
  #over {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(28, 33, 66, .88); cursor: pointer;
  }
  #over.show { display: flex; }
  #over h1 {
    margin: 0; padding: 8px 26px; background: var(--paper); color: var(--night); border-radius: 4px;
    font-size: 32px; letter-spacing: .1em; transform: rotate(-3deg);
  }
  #over p { margin: 0; font-size: 26px; }
  #over .tap {
    padding: 6px 18px; border-radius: 999px; border: 1.5px solid var(--lantern);
    font-size: 15px; letter-spacing: .12em; color: var(--lantern);
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <button id="rst" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M19.05 14.57A7.5 7.5 0 1 1 15.75 5.5"/><path class="solid" d="M17.35 2.73L18.69 7.2L14.15 8.27Z"/></svg></button>
  <div id="tally"><b id="score">0</b><small>BEST <span id="best">0</span></small></div>
  <button id="snd" aria-label="Sound"><svg viewBox="0 0 24 24"><path class="solid" d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.3a8 8 0 0 1 0 11.4"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
</div>
<div id="hint">Swipe to move · match 3 to pop</div>
<div id="over"><h1>OOPS!</h1><p id="final"></p><p class="tap">Tap to retry</p></div>

<script>
(() => {
  const COLS = 11, ROWS = 18;
  const KEY = 'ofwg:dango-skewer';
  const FOODS = 6, SWIPE_PX = 16;
  // step time falls from START_MS to MIN_MS as snacks are eaten; the fourth color joins later
  const START_MS = 250, MIN_MS = 150, RAMP_MS = 2.5;
  const START_COLORS = 3, UNLOCK_EATEN = 10;
  const PARTICLE_MS = 600, GHOST_MS = 260, RING_MS = 320, POPUP_MS = 700;
  const PALETTE = ['#ff5f7e', '#4fcfa6', '#ffb829', '#9575ff', '#fff0dc'];
  const HEAD = PALETTE.length - 1;
  const DARK = PALETTE.map(hex => {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${[n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * 0.62))})`;
  });
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right'
  };
  const FONT = '"Hiragino Mincho ProN", "Yu Mincho", Georgia, serif';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $hud = document.getElementById('hud');
  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $hint = document.getElementById('hint');
  const $over = document.getElementById('over');
  const $final = document.getElementById('final');
  const $snd = document.getElementById('snd');

  // cells holds one cell per ball, head first. Between steps each ball slides along the
  // snake's route: it sits `off` cells behind its cell and closes that gap as the step
  // progresses. trail keeps the cells just past the tail that a sliding ball may still
  // be passing through, and path is cells + trail, which is what rendering reads.
  let cells, trail, path, segs, foods, dir, queue, started, over, overTimer, score, best = 0, eaten, acc;
  let particles, ghosts, popups, rings, mouthAt, shake;
  let W = 0, H = 0, dpr = 1, bx = 0, by = 0, cell = 0, glow = [], board, popFont;
  const PX = new Float32Array(COLS * ROWS), PY = new Float32Array(COLS * ROWS);
  const embers = Array.from({ length: 12 }, () => ({
    x: Math.random() * COLS, y: Math.random() * ROWS, v: 0.4 + Math.random() * 0.7, ph: Math.random() * 6.3
  }));

  try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) { /* storage unavailable */ }

  // muting silences a master gain, so tones already scheduled go quiet too
  let ac = null, master = null, muted = false;
  const audio = () => {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      master = ac.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  const tone = (a, freq, delay, dur, type, vol) => {
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  };
  // each color owns one pentatonic note, so eating also tells which color went in
  const PENT = [0, 2, 4, 7];
  const semi = (base, steps) => base * Math.pow(2, steps / 12);
  const playEat = ci => { const a = audio(); if (a) tone(a, semi(392, PENT[ci]), 0, 0.14, 'triangle', 0.12); };
  const playPop = ci => {
    const a = audio(); if (!a) return;
    const f = semi(392, PENT[ci]);
    tone(a, f, 0, 0.4, 'sine', 0.2);
    tone(a, f * 1.26, 0.07, 0.4, 'sine', 0.15);
    tone(a, f * 1.5, 0.14, 0.5, 'sine', 0.15);
    tone(a, f * 2, 0.14, 0.3, 'triangle', 0.06);
  };
  const playOver = () => {
    const a = audio(); if (!a) return;
    [7, 4, 2, 0].forEach((s, i) => tone(a, semi(261.63, s), i * 0.16, 0.5, 'triangle', 0.15));
  };

  const rnd = n => Math.floor(Math.random() * n);
  const at = (list, x, y) => list.some(c => c.x === x && c.y === y);
  const expire = (list, t, life) => {
    for (let i = list.length - 1; i >= 0; i--) if (t - list[i].t > life) list.splice(i, 1);
  };
  const stepMs = () => Math.max(MIN_MS, START_MS - eaten * RAMP_MS);

  const spawnFood = t => {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (at(cells, x, y) || at(trail, x, y)) continue;
        if (!at(foods, x, y)) free.push({ x, y });
      }
    }
    if (!free.length) return;
    const p = free[rnd(free.length)];
    // keep the color on top of the stack on the board, so a run of three is always reachable
    const top = segs.length > 1 ? segs[1].c : -1;
    const ncolors = eaten >= UNLOCK_EATEN ? PALETTE.length - 1 : START_COLORS;
    const c = top >= 0 && !foods.some(f => f.c === top) ? top : rnd(ncolors);
    foods.push({ x: p.x, y: p.y, c, born: t });
  };

  const newGame = () => {
    const x = COLS >> 1, y = ROWS - 4;
    cells = [{ x, y }, { x, y: y + 1 }, { x, y: y + 2 }];
    trail = []; path = cells;
    segs = cells.map((c, i) => ({ c: i ? rnd(START_COLORS) : HEAD, off: 0, born: -1e9 }));
    foods = []; particles = []; ghosts = []; popups = []; rings = [];
    queue = []; dir = 'up'; started = false; over = false;
    score = 0; eaten = 0; acc = 0; mouthAt = -1e9; shake = 0;
    clearTimeout(overTimer);
    $over.classList.remove('show');
    $hint.style.display = '';
    // born far in the past: a clock read here can land after the next frame's timestamp and give a negative scale
    while (foods.length < FOODS) spawnFood(-1e9);
    renderHud();
  };

  const renderHud = () => { $score.textContent = score; $best.textContent = best; };

  const popRun = (t, ci) => {
    segs.splice(1, 3).forEach((s, i) => {
      const c = cells[1 + i];
      ghosts.push({ x: c.x, y: c.y, c: s.c, t });
      for (let k = 0; k < 8; k++) {
        const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 3;
        particles.push({ x: c.x, y: c.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, c: s.c, t });
      }
    });
    // the balls behind the gap slide forward along the old path
    segs.forEach((s, i) => { if (i) s.off = 3; });
    trail = cells.slice(segs.length);
    cells.length = segs.length;
    score += 30;
    popups.push({ x: cells[0].x, y: cells[0].y, t });
    playPop(ci);
  };

  const die = () => {
    over = true; shake = 1;
    playOver();
    $final.textContent = `${score} pts`;
    overTimer = setTimeout(() => $over.classList.add('show'), 700);
  };

  const step = t => {
    if (queue.length) dir = queue.shift();
    const nx = cells[0].x + DIRS[dir][0], ny = cells[0].y + DIRS[dir][1];
    const fi = foods.findIndex(f => f.x === nx && f.y === ny);
    // the tail cell is vacated this step unless the head eats
    const solid = fi >= 0 ? cells : cells.slice(0, -1);
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || at(solid, nx, ny)) return die();
    cells.unshift({ x: nx, y: ny });
    segs.forEach((s, i) => { s.off = fi >= 0 && i ? 0 : 1; });
    if (fi < 0) { trail = [cells.pop()]; return; }

    // the snack joins right behind the head, in the cell the head just left
    trail = [];
    const f = foods.splice(fi, 1)[0];
    segs.splice(1, 0, { c: f.c, off: 0, born: t });
    rings.push({ x: cells[1].x, y: cells[1].y, c: f.c, t });
    eaten++; score += 10; mouthAt = t;
    playEat(f.c);
    if (segs.length >= 4 && segs[2].c === f.c && segs[3].c === f.c) popRun(t, f.c);
    spawnFood(t);
    if (score > best) {
      best = score;
      try { localStorage.setItem(KEY, String(best)); } catch (e) { /* storage unavailable */ }
    }
    renderHud();
  };

  const start = () => {
    if (started) return;
    started = true; acc = 0;
    $hint.style.display = 'none';
  };

  const turn = d => {
    if (over) return;
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (OPP[ref] === d) return;
    start();
    if (d !== ref && queue.length < 2) queue.push(d);
  };

  let px = 0, py = 0, pid = null, swiped = false;
  cv.addEventListener('pointerdown', e => {
    if (pid !== null) return;
    pid = e.pointerId; swiped = false; px = e.clientX; py = e.clientY;
    cv.setPointerCapture(pid);
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    const dx = e.clientX - px, dy = e.clientY - py;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_PX) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    px = e.clientX; py = e.clientY; swiped = true;
  });
  cv.addEventListener('pointerup', e => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (!swiped && !over) start();
    audio(); // touch pointerup counts as a user activation, unlike pointerdown
  });
  cv.addEventListener('pointercancel', e => { if (e.pointerId === pid) pid = null; });
  ['gesturestart', 'contextmenu', 'dblclick'].forEach(n => window.addEventListener(n, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  window.addEventListener('keydown', e => {
    const d = KEYS[e.key];
    if (!d) return;
    e.preventDefault();
    audio();
    turn(d);
  });

  $over.addEventListener('click', newGame);
  document.getElementById('rst').addEventListener('click', newGame);
  $snd.addEventListener('click', () => {
    muted = !muted;
    $snd.classList.toggle('off', muted);
    if (master) master.gain.value = muted ? 0 : 1;
    audio();
  });

  const layout = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const top = $hud.getBoundingClientRect().bottom + 12, bottom = 24;
    const availH = H - top - bottom;
    cell = Math.max(1, Math.floor(Math.min((W - 12) / COLS, availH / ROWS, 64)));
    bx = (W - cell * COLS) / 2;
    by = top + (availH - cell * ROWS) / 2;
    board = new Path2D();
    board.roundRect(0, 0, cell * COLS, cell * ROWS, cell * 0.3);
    popFont = `700 ${cell * 0.6}px ${FONT}`;
    // lanterns hang just above the stall's top corners
    glow = [0, cell * COLS].map(x => {
      const g = ctx.createRadialGradient(x, 0, 0, x, 0, cell * COLS * 0.55);
      g.addColorStop(0, 'rgba(255,154,60,.55)');
      g.addColorStop(1, 'rgba(255,154,60,0)');
      return g;
    });
  };
  window.addEventListener('resize', layout);

  const update = (dt, t) => {
    const s = dt / 1000;
    particles.forEach(p => { p.vy += 14 * s; p.x += p.vx * s; p.y += p.vy * s; });
    expire(particles, t, PARTICLE_MS);
    expire(ghosts, t, GHOST_MS);
    expire(popups, t, POPUP_MS);
    expire(rings, t, RING_MS);
    embers.forEach(e => {
      e.y -= e.v * s;
      if (e.y < -0.3) { e.y = ROWS + 0.3; e.x = Math.random() * COLS; }
    });
    shake = Math.max(0, shake - dt / 400);
  };

  const disc = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };

  // gx/gy are grid coordinates, r is in cells
  const ball = (gx, gy, r, ci, scale) => {
    const x = (gx + 0.5) * cell, y = (gy + 0.5) * cell, rad = r * cell * scale;
    ctx.fillStyle = DARK[ci]; disc(x, y, rad);
    ctx.fillStyle = PALETTE[ci]; disc(x, y, rad * 0.86);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    disc(x - rad * 0.36, y - rad * 0.38, rad * 0.14);
    disc(x - rad * 0.12, y - rad * 0.52, rad * 0.07);
  };

  const face = (r, t) => {
    const cx = (PX[0] + 0.5) * cell, cy = (PY[0] + 0.5) * cell;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.1, r * 0.92, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#e8453c';
    ctx.fillRect(cx - r, cy - r * 0.82, r * 2, r * 0.3);
    ctx.restore();

    const x = cx + DIRS[dir][0] * r * 0.2, y = cy + DIRS[dir][1] * r * 0.2;
    ctx.fillStyle = 'rgba(255,127,159,.55)';
    [-1, 1].forEach(sx => {
      ctx.beginPath(); ctx.ellipse(x + sx * r * 0.52, y + r * 0.22, r * 0.2, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = ctx.strokeStyle = '#3a2a2e';
    ctx.lineWidth = r * 0.1; ctx.lineCap = 'round';
    if (over) {
      const e = r * 0.1;
      [-1, 1].forEach(sx => {
        const ex = x + sx * r * 0.34, ey = y - r * 0.06;
        ctx.beginPath();
        ctx.moveTo(ex - e, ey - e); ctx.lineTo(ex + e, ey + e);
        ctx.moveTo(ex + e, ey - e); ctx.lineTo(ex - e, ey + e);
        ctx.stroke();
      });
    } else {
      [-1, 1].forEach(sx => disc(x + sx * r * 0.34, y - r * 0.06, r * 0.12));
    }
    if (t - mouthAt < 180 || over) {
      ctx.fillStyle = '#c2455f'; disc(x, y + r * 0.28, r * 0.15);
    } else {
      ctx.beginPath(); ctx.arc(x, y + r * 0.14, r * 0.14, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    }
  };

  const render = (t, p) => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(bx + (Math.random() - 0.5) * 8 * shake, by + (Math.random() - 0.5) * 8 * shake);

    ctx.save();
    ctx.clip(board);
    ctx.fillStyle = '#262c55';
    ctx.fillRect(0, 0, cell * COLS, cell * ROWS);
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(t / 350);
    glow.forEach(g => { ctx.fillStyle = g; ctx.fillRect(0, 0, cell * COLS, cell * COLS * 0.6); });
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,154,60,.45)'; ctx.lineWidth = 3;
    ctx.stroke(board);

    ctx.fillStyle = 'rgb(255,170,80)';
    embers.forEach(e => {
      ctx.globalAlpha = 0.3 + 0.25 * Math.sin(t / 300 + e.ph);
      disc((e.x + Math.sin(t / 900 + e.ph) * 0.3) * cell, e.y * cell, cell * 0.06);
    });
    ctx.globalAlpha = 1;

    foods.forEach(f => {
      const s = Math.min(1, (t - f.born) / 200);
      const bob = Math.sin(t / 260 + f.x * 1.7 + f.y) * 0.05;
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse((f.x + 0.5) * cell, (f.y + 0.88) * cell, cell * 0.22 * s, cell * 0.06 * s, 0, 0, Math.PI * 2); ctx.fill();
      ball(f.x, f.y + bob - 0.06, 0.5, f.c, s);
    });

    const n = segs.length;
    // p is the progress (0..1) of the current step
    for (let i = 0; i < n; i++) {
      const u = i + segs[i].off * (1 - p), k = Math.floor(u), f = u - k;
      const a = path[k], b = f > 1e-6 ? path[k + 1] : a;
      PX[i] = a.x + (b.x - a.x) * f;
      PY[i] = a.y + (b.y - a.y) * f;
    }
    ctx.strokeStyle = '#e0c08f'; ctx.lineWidth = cell * 0.14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = (PX[i] + 0.5) * cell, y = (PY[i] + 0.5) * cell;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    // a head with no body left still trails the stick, pointing opposite to its heading
    const dx = n > 1 ? PX[n - 1] - PX[n - 2] : -DIRS[dir][0], dy = n > 1 ? PY[n - 1] - PY[n - 2] : -DIRS[dir][1];
    const len = Math.hypot(dx, dy) || 1;
    ctx.lineTo((PX[n - 1] + 0.5 + dx / len * 1.1) * cell, (PY[n - 1] + 0.5 + dy / len * 1.1) * cell);
    ctx.stroke();

    for (let i = n - 1; i >= 0; i--) {
      // a ball that just joined overshoots to about 1.17 before settling (ease-out-back)
      const k = Math.min(1, (t - segs[i].born) / 300) - 1;
      ball(PX[i], PY[i], 0.5, segs[i].c, 0.3 + 0.7 * (1 + 4 * k * k * k + 3 * k * k));
    }
    face(0.5 * cell, t);

    ghosts.forEach(g => {
      const k = (t - g.t) / GHOST_MS;
      ctx.globalAlpha = 1 - k;
      ball(g.x, g.y, 0.5, g.c, 1 + 0.5 * k);
    });
    ctx.globalAlpha = 1;

    ctx.lineWidth = cell * 0.08;
    rings.forEach(r => {
      const k = (t - r.t) / RING_MS;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = PALETTE[r.c];
      ctx.beginPath(); ctx.arc((r.x + 0.5) * cell, (r.y + 0.5) * cell, cell * (0.5 + 0.7 * k), 0, Math.PI * 2); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    particles.forEach(q => {
      ctx.globalAlpha = 1 - (t - q.t) / PARTICLE_MS;
      ctx.fillStyle = PALETTE[q.c];
      disc((q.x + 0.5) * cell, (q.y + 0.5) * cell, cell * 0.09);
    });
    ctx.globalAlpha = 1;

    if (popups.length) {
      ctx.font = popFont;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = cell * 0.12; ctx.lineJoin = 'round';
      popups.forEach(q => {
        const age = (t - q.t) / POPUP_MS;
        ctx.globalAlpha = 1 - age;
        const x = (q.x + 0.5) * cell, y = (q.y - age * 1.2) * cell;
        ctx.strokeStyle = '#1c2142'; ctx.strokeText('+30', x, y);
        ctx.fillStyle = '#f3e6cf'; ctx.fillText('+30', x, y);
      });
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  };

  let last = 0;
  const frame = t => {
    requestAnimationFrame(frame); // first, so one throwing frame cannot end the loop
    const dt = Math.min(t - last, 50);
    last = t;
    if (started && !over) {
      acc += dt;
      const ms = stepMs();
      while (acc >= ms && !over) { acc -= ms; step(t); path = cells.concat(trail); }
    }
    update(dt, t);
    render(t, started && !over ? Math.min(1, acc / stepMs()) : 1);
  };

  layout();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
